<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" id="themeColor" content="#f2f6fa">
<title>专业实习智能平台 · 可运行原型 v0.2</title>
<style>
.demo-notice{margin:12px 18px;padding:9px 12px;border-radius:8px;background:#f3f4f6;color:#4b5563;font-size:13px;line-height:1.5}

  :root{
    --ink:#182334; --sub:#667386; --mute:#8793a5; --line:#dfe6ef;
    --side:#edf3f8; --bg:#f2f6fa; --card:#fff; --card-soft:#f8fafc;
    --blue:#2f67d8; --blue2:#4b7fea; --soft:#edf4ff; --warm:#c9932e; --green:#27845e;
    --radius:15px;
    --shadow-sm:0 1px 2px rgba(31,45,66,.04);
    --shadow-card:0 1px 2px rgba(31,45,66,.035),0 10px 28px rgba(35,57,88,.055);
    --shadow-blue:0 10px 30px rgba(47,103,216,.12);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  html{color-scheme:light}
  body{color:var(--ink);background:var(--bg);font-family:Inter,"SF Pro Display","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased}
  button,input,select,textarea{font-family:inherit}
  button,a,[role="button"]{touch-action:manipulation}
  a{color:inherit}
  :where(button,a,input,select,textarea,[tabindex]):focus-visible{outline:3px solid rgba(47,103,216,.26);outline-offset:2px}
  .app{display:flex;height:100vh;overflow:hidden}
  .side{width:256px;flex:none;background:linear-gradient(180deg,#edf3f9 0%,#f1f5f9 100%);border-right:1px solid #d9e2ec;padding:18px 14px 14px;display:flex;flex-direction:column;box-shadow:inset -1px 0 0 rgba(255,255,255,.7)}
  .brandline{display:flex;align-items:center;gap:9px;padding:4px 8px 16px}
  .brandmark{width:24px;height:24px;flex:none;border-radius:50%;object-fit:cover;background:#fff;padding:1px;box-shadow:0 0 0 1px rgba(15,23,42,.06)}
  .login-brand .brandmark{width:32px;height:32px}
  .brandname{font-size:13px;font-weight:700}
  .ver{margin-left:auto;font-size:9px;color:#a9b0bc;background:#fff;border:1px solid #eaedf4;border-radius:6px;padding:2px 5px}
  .primary-btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:40px;border:0;border-radius:12px;
    background:var(--blue);color:#fff;font-size:13.5px;font-weight:650;cursor:pointer;
    box-shadow:0 7px 18px rgba(47,103,216,.23);transition:background-color .16s,box-shadow .16s}
  .primary-btn:hover{background:#275bc4;box-shadow:0 9px 22px rgba(47,103,216,.28)}
  .primary-btn svg{width:15px;height:15px}
  nav{margin-top:12px;display:flex;flex-direction:column;gap:3px}
  .nav-item{display:flex;align-items:center;gap:11px;padding:11px 12px;border-radius:10px;font-size:13.5px;color:#3f4b5e;cursor:pointer;position:relative;text-decoration:none;transition:background-color .16s,color .16s}
  .nav-item:hover{background:rgba(255,255,255,.72);color:#1f2c3f}
  .nav-item.active{background:#e2ecfb;color:#173b78;font-weight:650;box-shadow:inset 0 0 0 1px rgba(74,119,196,.08)}
  .nav-item.active:before{content:"";position:absolute;left:-14px;top:9px;bottom:9px;width:3.5px;border-radius:0 4px 4px 0;background:var(--blue)}
  .nav-item svg{width:17px;height:17px;color:#6d7685;flex:none}
  .nav-item.active svg{color:#2b5cd9}
  .nav-item .badge{margin-left:auto;font-size:10px;color:#8f959e;background:#eceef3;border-radius:5px;padding:1px 5px}
  .divider{height:1px;background:#e9ebef;margin:16px 10px}
  .side-label{font-size:11px;color:var(--mute);letter-spacing:.3px;margin:0 10px 8px}
  .side-card{margin:0 4px;background:#fff;border:1px solid #e8ebf2;border-radius:12px;padding:11px 12px}
  .side-card .big{font-size:13px;font-weight:600}
  .side-card .small{font-size:10.5px;color:#9aa1ad;margin-top:4px;line-height:1.5}
  .side-list{padding:0 10px}
  .side-list-row{display:flex;justify-content:space-between;gap:10px;padding:5px 0;font-size:11.5px;color:#6f757f}
  .side-list-row .t{color:#b0b6c0;font-size:10.5px;flex:none}
  .side-bottom{margin-top:auto}
  .side-foot{display:flex;align-items:center;gap:10px;padding:12px 8px 2px;border-top:1px solid #e9ebef}
  .avatar{width:32px;height:32px;border-radius:50%;overflow:hidden;flex:none}
  .who .name{font-size:12.5px;font-weight:600}
  .who .sub{font-size:10.5px;color:#9aa1ad;margin-top:1px}
  .foot-icon{margin-left:auto;color:#9aa3b2}
  .foot-icon svg{width:15px;height:15px}
  .announce{display:block;width:calc(100% - 8px);margin:0 4px 10px;background:#fff;border:1px solid #e8ebf2;border-radius:10px;padding:8px 10px;overflow:hidden;text-align:left;font:inherit;cursor:pointer;transition:border-color .16s,background .16s,box-shadow .16s}
  .announce:hover{border-color:#cbd9ec;background:#fbfdff;box-shadow:0 5px 16px rgba(41,72,114,.07)}
  .announce:focus-visible{outline:2px solid #7da4e8;outline-offset:2px}
  .announce-label{display:flex;align-items:center;gap:5px;font-size:10px;color:#8f959e;margin-bottom:5px}
  .announce-label i{width:5px;height:5px;border-radius:50%;background:var(--blue);display:inline-block}
  .announce-more{margin-left:auto;color:#53739b;font-size:10px}
  .announce-track{overflow:hidden;font-size:10.5px;color:#4f5b6b;line-height:1.55}
  .announce-track strong{display:block;margin-bottom:2px;color:#344152;font-size:11.5px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .announce-track span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .announcement-body{font-size:13px;line-height:1.9;color:#394a60}
  .announcement-body p{margin:0 0 10px}
  .announcement-meta{display:flex;align-items:center;gap:8px;margin-bottom:14px;color:#7d8b9d;font-size:11px}
  .announcement-facts{display:grid;gap:7px;margin:14px 0;padding:12px 14px;border:1px solid #e4ebf4;border-radius:11px;background:#f8fafc}
  .announcement-facts div{font-size:12px;color:#4f6075}
  .announcement-facts b{display:inline-block;min-width:72px;color:#7d8b9d;font-weight:500}
  .announcement-foot{margin-top:14px;padding-top:12px;border-top:1px solid #edf1f6;color:#7d8b9d;font-size:11px}
  @keyframes marquee{0%,10%{transform:translateX(0)}100%{transform:translateX(-100%)}}
  main{flex:1;overflow-y:auto;padding:28px 34px 44px;background:linear-gradient(180deg,#f7f9fc 0,#f2f6fa 250px,#f2f5f9 100%)}
  .page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:18px}
  .crumb{font-size:11px;color:#9aa1ad;margin-bottom:6px}
  h1{font-size:28px;font-weight:800;letter-spacing:-.6px;text-wrap:balance}
  .sub{font-size:12.5px;color:var(--mute);margin-top:6px}
  .page-head .sub,.card-head .card-sub,.card>.foot-note{display:none}
  .actions{display:flex;gap:8px;flex-wrap:wrap}
  .btn{height:34px;padding:0 13px;border-radius:9px;border:1px solid #dce4ee;background:rgba(255,255,255,.92);font-size:12px;color:#556274;cursor:pointer;box-shadow:var(--shadow-sm);transition:background-color .16s,border-color .16s,box-shadow .16s,color .16s}
  a.btn{display:inline-flex;align-items:center;gap:6px;text-decoration:none}
  a.btn svg{width:14px;height:14px}
  .btn:hover{background:#f7faff;border-color:#cbd8e8;color:#27364b}
  .btn.primary{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:650;box-shadow:0 6px 16px rgba(47,103,216,.20)}
  .btn.primary:hover{background:#275bc4;border-color:#275bc4;color:#fff}
  .btn.danger{color:#b3261e;border-color:#f0d3d0}
  .btn.small{height:28px;font-size:11px;padding:0 9px}
  .btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
  .kpi{background:rgba(255,255,255,.97);border:1px solid var(--line);border-radius:var(--radius);padding:16px 17px;box-shadow:var(--shadow-card)}
  .kpi .k{font-size:11.5px;color:var(--mute)}
  .kpi .n{font-size:26px;font-weight:800;letter-spacing:-.8px;margin-top:5px}
  .kpi .n,.report-score,.table,.timeline-month,.points{font-variant-numeric:tabular-nums}
  .kpi .d{font-size:10.5px;color:#9aa1ad;margin-top:4px;display:flex;align-items:center;gap:5px}
  .up{color:var(--green);background:#eaf7f1;border-radius:5px;padding:1px 5px;font-weight:600}
  .warn{color:#b4690e;background:#fdf1df;border-radius:5px;padding:1px 5px;font-weight:600}
  .grid-2{display:grid;grid-template-columns:1.62fr 1fr;gap:14px;margin-top:14px}
  .report-toolbar{display:flex;align-items:center;gap:12px;margin-bottom:12px;padding:10px 14px}
  .report-toolbar-label{font-size:11.5px;color:var(--mute)}
  .report-toolbar-meta{margin-left:auto;font-size:11px;color:var(--mute)}
  .report-list-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}
  .report-search{display:flex;align-items:center;gap:8px}
  .report-search .field{width:240px}
  .student-ledger-toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:11px;margin-bottom:12px;border:1px solid #dfe7f1;border-radius:12px;background:#f7faff;box-shadow:var(--shadow-sm)}
  .student-ledger-search{display:flex;align-items:center;gap:7px;margin-right:auto}
  .student-ledger-search .field{width:260px;background:#fff}
  .student-filter-panel{padding:13px;margin:0 0 12px;border:1px solid #d4e2f8;border-radius:12px;background:#f2f7ff;box-shadow:var(--shadow-sm)}
  .student-filter-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
  .student-filter-foot{display:flex;align-items:center;gap:8px;margin-top:10px;padding-top:10px;border-top:1px solid #e8eef7}
  .student-filter-foot .foot-note{margin-right:auto}
  .filter-badge{display:inline-flex;align-items:center;justify-content:center;min-width:16px;height:16px;padding:0 4px;margin-left:4px;border-radius:99px;background:#e8f0ff;color:#2b5cd9;font-size:9px}
  .result-summary{display:flex;align-items:center;gap:10px;margin-bottom:8px;font-size:11px;color:#8f959e}
  .result-summary button{border:0;background:transparent;color:#2f6fed;font-size:11px;cursor:pointer;padding:0}
  .report-score{font-size:12px;color:#373c43;font-weight:600;white-space:nowrap}
  .report-score span{font-size:10px;color:#8f959e;font-weight:400;margin-left:2px}
  .resume-file-card .card-head svg{width:16px;height:16px;color:#2f6fed}
  .application-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .application-actions .view-action{min-width:78px}
  .application-actions .decision-group{display:flex;align-items:center;gap:8px;margin-left:16px;padding-left:16px;border-left:1px solid #e3e8f0}
  .application-rank{display:inline-flex;align-items:center;padding:3px 8px;border-radius:99px;font-size:10px;font-weight:650;white-space:nowrap}
  .application-rank.first{background:#e8f0ff;color:#2556bd}
  .application-rank.second{background:#e7f6ef;color:#237a52}
  .application-rank.none{background:#f1f4f8;color:#758194}
  .btn.approve{background:#237a52;border-color:#237a52;color:#fff;font-weight:600}
  .btn.approve:hover{background:#1b6443;border-color:#1b6443}
  .btn.reject{background:#fff;border-color:#e6aaa4;color:#b3261e;font-weight:600}
  .btn.reject:hover{background:#fff4f2}
  .student-import-modal{width:760px!important}
  .student-import-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:14px}
  .student-import-head h3{font-size:17px;margin-bottom:5px}
  .student-import-actions{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
  .import-file-box{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:16px;border:1px dashed #cfdcf2;border-radius:12px;background:#fafcff}
  .import-file-box strong{display:block;font-size:13px;color:#373c43}
  .import-file-box span{display:block;font-size:11px;color:#8f959e;margin-top:4px}
  .import-preview{max-height:310px;overflow:auto;border:1px solid #edf1f7;border-radius:10px}
  .import-preview .table th{position:sticky;top:0;background:#fff;z-index:1}
  .import-valid{color:#1f7a52;background:#eaf7f1}
  .import-invalid{color:#b3261e;background:#fbeceb}
  .report-list-foot{font-size:10.5px;color:var(--mute);margin-top:10px;text-align:right}
  .dashboard-tabs{margin-bottom:12px}
  .volunteer-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
  .volunteer-resume-trigger{display:inline-flex;align-items:center;gap:7px}
  .volunteer-resume-trigger{white-space:nowrap}
  .volunteer-resume-trigger svg{width:14px;height:14px}
  .volunteer-resume-count{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:18px;padding:0 5px;border-radius:99px;background:rgba(255,255,255,.2);font-size:10px}
  .volunteer-filterbar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:12px}
  .volunteer-filter{height:32px;padding:0 12px;border:1px solid #dfe7f1;border-radius:9px;background:rgba(255,255,255,.9);color:#68778b;font:inherit;font-size:11.5px;cursor:pointer}
  .volunteer-filter:hover{border-color:#b7cbe5;color:#35577f}
  .volunteer-filter.is-active{border-color:#c8d9f1;background:#eaf2ff;color:#2456b5;font-weight:650}
  .volunteer-mode-panel{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:12px;padding:12px 14px;border:1px solid #dfe7f1;border-radius:13px;background:rgba(255,255,255,.92);box-shadow:var(--shadow-sm)}
  .volunteer-mode-title{font-size:12.5px;font-weight:650;color:#37475c;white-space:nowrap}
  .volunteer-mode-switch{display:grid;grid-template-columns:1fr 1fr;gap:5px;padding:3px;border-radius:10px;background:#eff3f8}
  .volunteer-mode-button{min-width:104px;height:34px;border:0;border-radius:8px;background:transparent;color:#748196;font:inherit;font-size:12px;cursor:pointer}
  .volunteer-mode-button.is-active{background:#fff;color:#2456b5;font-weight:650;box-shadow:0 2px 8px rgba(31,45,66,.09)}
  .volunteer-mode-button[data-mode="self"].is-active{color:#237a52}
  .volunteer-unit-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:11px}
  .volunteer-unit-card{position:relative;display:flex;flex-direction:column;min-height:184px;padding:15px;border:1px solid #dfe7f1;border-radius:14px;background:rgba(255,255,255,.98);box-shadow:var(--shadow-card);cursor:pointer;transition:border-color .18s,box-shadow .18s,transform .18s,background .18s}
  .volunteer-unit-card:hover{border-color:#a9c1e4;box-shadow:0 14px 34px rgba(37,64,105,.12);transform:translateY(-2px)}
  .volunteer-unit-card:focus-visible{outline:2px solid #7da4f5;outline-offset:2px}
  .volunteer-unit-card.is-first{border-color:#8eb4f5;background:linear-gradient(180deg,#fff 0%,#f2f7ff 100%);box-shadow:0 0 0 3px rgba(47,103,216,.06),0 14px 34px rgba(37,64,105,.09)}
  .volunteer-unit-card.is-second{border-color:#b7d8c9;background:linear-gradient(180deg,#fff 0%,#f3fbf7 100%);box-shadow:0 0 0 3px rgba(35,122,82,.05),0 14px 34px rgba(37,64,105,.08)}
  .volunteer-unit-card.is-locked{cursor:default}
  .volunteer-unit-card.is-locked:hover{transform:none}
  .volunteer-unit-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
  .volunteer-unit-name{font-size:15px;font-weight:760;letter-spacing:-.2px;color:#1f2d40}
  .volunteer-role-name{margin-top:4px;font-size:12px;font-weight:600;color:#3b73b8}
  .volunteer-rank-tag{display:inline-flex;align-items:center;gap:4px;flex:none;padding:4px 8px;border-radius:99px;font-size:10px;font-weight:650}
  .volunteer-rank-tag.first{background:#e8f0ff;color:#2556bd}
  .volunteer-rank-tag.second{background:#e7f6ef;color:#237a52}
  .volunteer-rank-tag.open{background:#f1f4f8;color:#6d7a8d}
  .volunteer-unit-city{margin-top:11px;color:#7f8b9d;font-size:11.5px}
  .volunteer-unit-tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px}
  .volunteer-unit-tags span{padding:3px 6px;border-radius:6px;background:#f4f7fb;color:#5d6c80;font-size:10px;line-height:1.45}
  .volunteer-category{display:inline-flex;width:max-content;margin-top:8px;padding:3px 7px;border-radius:6px;background:#edf4ff;color:#446da7;font-size:10px;font-weight:600}
  .volunteer-card-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:auto;padding-top:11px;border-top:1px solid #edf1f6;color:#54719b;font-size:11px;font-weight:600}
  .volunteer-success{position:relative;display:flex;align-items:center;gap:15px;overflow:hidden;padding:22px 24px;border:1px solid #cfe8d8;border-radius:16px;background:linear-gradient(110deg,#f4fbf6,#edf8f1);box-shadow:var(--shadow-card)}
  .volunteer-success::after{content:"";position:absolute;right:-32px;bottom:-55px;width:170px;height:170px;border:22px solid rgba(35,122,82,.055);border-radius:50%}
  .volunteer-success-mark{position:relative;z-index:1;display:grid;width:42px;height:42px;flex:none;place-items:center;border-radius:50%;background:#2a8a5e;color:#fff;font-size:21px;font-weight:700;box-shadow:0 8px 20px rgba(35,122,82,.2)}
  .volunteer-success-copy{position:relative;z-index:1;min-width:0}
  .volunteer-success-copy h2{font-size:20px;line-height:1.25;color:#1f6f4a}
  .volunteer-success-meta{display:flex;flex-wrap:wrap;gap:8px 20px;margin-top:7px;color:#597668;font-size:11.5px}
  .volunteer-progress-list{display:grid;gap:12px;margin-top:14px}
  .volunteer-progress-card{padding:17px 18px;border:1px solid #dfe7f1;border-radius:15px;background:rgba(255,255,255,.98);box-shadow:var(--shadow-card)}
  .volunteer-self-unit{margin-top:12px;padding:18px;border:1px solid #dfe7f1;border-radius:15px;background:rgba(255,255,255,.98);box-shadow:var(--shadow-card)}
  .volunteer-self-unit-form{display:flex;align-items:flex-end;gap:10px;margin-top:10px}
  .volunteer-self-unit-form .field-wrap{flex:1;min-width:0}
  .volunteer-self-unit-form .field{height:40px}
  .volunteer-self-unit-form .btn{height:40px;white-space:nowrap}
  .volunteer-self-unit-result{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:8px;padding:12px 14px;border:1px solid #d6e7dd;border-radius:10px;background:#f4fbf7;color:#285e46;font-size:13px;font-weight:600}
  .volunteer-progress-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
  .volunteer-progress-title{display:flex;align-items:center;gap:10px;min-width:0}
  .volunteer-progress-title strong{font-size:14px;color:#243348}
  .volunteer-progress-role{margin-top:3px;color:#7c899a;font-size:11px}
  .volunteer-progress-meta{display:flex;flex-wrap:wrap;gap:7px 16px;margin-top:10px;color:#7d899a;font-size:11px}
  .volunteer-stages{position:relative;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin-top:18px}
  .volunteer-stages.is-self{grid-template-columns:repeat(3,minmax(0,1fr))}
  .volunteer-stages::before{content:"";position:absolute;top:8px;left:10%;right:10%;height:2px;background:#e4eaf3}
  .volunteer-stage{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:7px;text-align:center;color:#96a0ae;font-size:10.5px}
  .volunteer-stage-dot{width:16px;height:16px;border:2px solid #dce4ef;border-radius:50%;background:#fff;box-shadow:0 0 0 3px #fff}
  .volunteer-stage.is-complete{color:#2a7f5b}
  .volunteer-stage.is-complete .volunteer-stage-dot{border-color:#2a8a5e;background:#2a8a5e;box-shadow:0 0 0 3px #fff}
  .volunteer-stage.is-complete .volunteer-stage-dot::after{content:"✓";display:block;margin-top:-4px;color:#fff;font-size:10px;font-weight:700}
  .volunteer-stage.is-current{color:#2f67d8;font-weight:650}
  .volunteer-stage.is-current .volunteer-stage-dot{border-color:#6b96e9;background:#eaf1ff;box-shadow:0 0 0 4px rgba(47,103,216,.08)}
  .volunteer-stage.is-ended{opacity:.52}

  /* 登录页 · 分镜扫光 */
  .login-page{--login-accent:#2f67d8;--login-accent-rgb:47,103,216;position:relative;isolation:isolate;display:grid;grid-template-columns:minmax(0,1.12fr) minmax(430px,.88fr);min-height:100vh;overflow-x:hidden;overflow-y:auto;background:linear-gradient(116deg,rgba(var(--login-accent-rgb),.065),transparent 48%),#fbfcfe;color:var(--ink)}

  .login-page.role-enterprise{--login-accent:#b77826;--login-accent-rgb:183,120,38}
  .login-page::before{content:"";position:absolute;z-index:-1;top:-40%;left:7%;width:170px;height:175%;background:linear-gradient(90deg,transparent,rgba(var(--login-accent-rgb),.06),transparent);transform:rotate(17deg);pointer-events:none}
  .login-page.is-role-switching::after{content:"";position:absolute;z-index:20;top:-25%;bottom:-25%;left:-38%;width:34%;pointer-events:none;background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);transform:skewX(-15deg);animation:login-page-sweep .72s cubic-bezier(.2,.7,.2,1) both}

  .login-page.is-role-switching .login-copy::before{animation:login-rail-flash .7s cubic-bezier(.15,.8,.2,1) both}
  .login-page.is-role-switching .login-copy .eyebrow{animation:login-copy-sweep .5s cubic-bezier(.15,.8,.2,1) both}
  .login-page.is-role-switching .login-copy h1 .l1{animation:login-title-sweep .65s cubic-bezier(.15,.8,.2,1) both}
  .login-page.is-role-switching .login-copy h1 .l2{animation:login-title-sweep .65s .08s cubic-bezier(.15,.8,.2,1) both}
  .login-page.is-role-switching .login-copy .desc{animation:login-copy-sweep .55s .12s cubic-bezier(.15,.8,.2,1) both}

  .login-page.is-role-switching .roles{animation:login-tabs-flash .65s ease both}
  .login-page.is-role-switching .login-primary::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 20%,rgba(255,255,255,.32),transparent 80%);animation:login-button-sheen .65s .12s ease both}
  @keyframes login-page-sweep{from{transform:translateX(0) skewX(-15deg);opacity:0}15%{opacity:1}to{transform:translateX(420%) skewX(-15deg);opacity:0}}
  @keyframes login-title-sweep{from{opacity:0;clip-path:inset(0 100% 0 0);transform:translateX(25px)}to{opacity:1;clip-path:inset(0 0 0 0);transform:translateX(0)}}
  @keyframes login-copy-sweep{from{opacity:0;clip-path:inset(0 100% 0 0);transform:translateX(18px)}to{opacity:1;clip-path:inset(0 0 0 0);transform:translateX(0)}}
  @keyframes login-card-sweep{from{opacity:.65;transform:translateX(14px)}to{opacity:1;transform:translateX(0)}}

  @keyframes login-rail-flash{from{transform:scaleY(.3);opacity:.2}to{transform:scaleY(1);opacity:1}}
  @keyframes login-button-sheen{0%{opacity:0;transform:translateX(-70%)}35%{opacity:1}100%{opacity:0;transform:translateX(75%)}}

  .assistant-header{height:64px;flex:none;position:relative;z-index:5;margin:20px 28px 0;padding:0 18px;display:flex;align-items:center;justify-content:space-between;border:1px solid #ffffffd9;border-radius:20px;background:linear-gradient(120deg,#ffffffc9,#f5f9ff9c);box-shadow:0 8px 28px #6584b416,inset 0 0 0 1px #cbdcf34d;backdrop-filter:blur(20px) saturate(140%);-webkit-backdrop-filter:blur(20px) saturate(140%)}

/* ==========================================================================
   实习记录 · 日历 / 周报 / 作品
   ========================================================================== */
.ix-page{
  --ix-ink:#243447;
  --ix-sub:#5f6d80;
  --ix-mute:#8d99a8;
  --ix-surface:#ffffff;
  --ix-faint:rgba(255,255,255,.42);
  max-width:1180px;
  margin:0 auto;
  color:var(--ix-ink);
}
html[data-theme="dark"] .ix-page{
  --ix-ink:#e7edf5;
  --ix-sub:#aab5c3;
  --ix-mute:#8b98a8;
  --ix-surface:#1c2431;
  --ix-faint:rgba(255,255,255,.045);
}
.ix-page--start{min-height:calc(100vh - 140px);display:flex;align-items:center;justify-content:center}
.ix-num{font-variant-numeric:tabular-nums}

/* ---------- 顶栏 ---------- */
.ix-top{
  height:60px;display:flex;align-items:center;gap:24px;padding:0 20px;border-radius:18px;
  background:linear-gradient(120deg,#ffffffde,#f6faffb8);border:1px solid #ffffffd9;
  box-shadow:0 8px 28px #6584b416,inset 0 0 0 1px #cbdcf34d;
  backdrop-filter:blur(20px) saturate(140%);-webkit-backdrop-filter:blur(20px) saturate(140%);
  margin-bottom:22px;position:relative;z-index:4;
}
.ix-top h1{font-size:16px;font-weight:650;letter-spacing:.01em;white-space:nowrap;margin:0}
.ix-tabs{display:flex;align-items:center;gap:2px}
.ix-tab{height:34px;padding:0 13px;border:0;border-radius:9px;background:transparent;font:inherit;font-size:13.5px;color:#75839a;cursor:pointer;transition:background-color .16s,color .16s}
.ix-tab:hover{background:#ffffffb3;color:#2b3442}
.ix-tab.is-on{background:#fff;color:#1c2a3e;font-weight:600;box-shadow:0 2px 10px rgba(31,45,66,.07)}
.ix-top-right{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.ix-btn{display:inline-flex;align-items:center;gap:6px}
.ix-btn .ix-btn-ico{display:inline-flex;margin-right:1px}
.ix-btn .ix-btn-ico svg{width:11px;height:11px;display:block}
.ix-range{font-size:12px;color:var(--ix-mute);font-variant-numeric:tabular-nums;white-space:nowrap}
.ix-link{border:0;background:transparent;font:inherit;font-size:12.5px;color:#4a6f9f;cursor:pointer;padding:6px 2px;border-radius:6px;transition:color .16s}
.ix-link:hover{color:#2f67d8}
.ix-btn{height:32px;padding:0 13px;border-radius:9px;border:1px solid #dfe7f1;background:#fff;color:#3d4b60;font:inherit;font-size:12px;cursor:pointer;transition:background-color .16s,border-color .16s,box-shadow .16s}
.ix-btn:hover{background:#f6faff;border-color:#c9d7ea}
.ix-btn.primary{background:#2f67d8;border-color:#2f67d8;color:#fff;font-weight:600;box-shadow:0 4px 12px rgba(47,103,216,.18)}
.ix-btn.primary:hover{background:#275bc4;border-color:#275bc4}
.ix-btn:disabled{opacity:.4;cursor:not-allowed;box-shadow:none}

/* ---------- 日历 ---------- */
.ix-slogan{display:flex;align-items:center;justify-content:center;gap:13px;margin:0 auto 20px;font-size:16px;font-weight:550;color:#3d4d64;letter-spacing:.02em;text-align:center}
.ix-slogan-text{white-space:nowrap}
.ix-slogan-deco{position:relative;width:74px;height:1px;background:linear-gradient(90deg,rgba(61,77,100,0),rgba(61,77,100,.26));flex:none}
.ix-slogan-deco:after{content:"";position:absolute;right:-2px;top:50%;width:5px;height:5px;border:1px solid rgba(61,77,100,.42);transform:translateY(-50%) rotate(45deg)}
.ix-slogan-deco.r{background:linear-gradient(270deg,rgba(61,77,100,0),rgba(61,77,100,.26))}
.ix-slogan-deco.r:after{right:auto;left:-2px}
html[data-theme="dark"] .ix-slogan{color:#b9c4d2}
html[data-theme="dark"] .ix-slogan-deco{background:linear-gradient(90deg,rgba(185,196,210,0),rgba(185,196,210,.28))}
html[data-theme="dark"] .ix-slogan-deco.r{background:linear-gradient(270deg,rgba(185,196,210,0),rgba(185,196,210,.28))}
html[data-theme="dark"] .ix-slogan-deco:after{border-color:rgba(185,196,210,.5)}
@media(max-width:760px){
  .ix-slogan{font-size:15px;gap:10px;margin-bottom:16px}
  .ix-slogan-deco{width:34px}
}
.ix-cal{min-width:0}
.ix-monthrow{display:flex;align-items:center;gap:9px;width:100%;margin:20px 0 9px;padding:0;border:0;background:transparent;font:inherit;text-align:left;cursor:pointer;-webkit-tap-highlight-color:transparent}
.ix-monthrow.is-first{margin-top:2px}
.ix-monthrow span{font-size:11px;font-weight:600;color:#7f8d9f;letter-spacing:.06em;white-space:nowrap;transition:color .14s}
.ix-monthrow:hover span,.ix-monthrow:focus-visible span{color:#3d4d64}
.ix-monthrow:focus-visible{outline:2px solid rgba(47,103,216,.35);outline-offset:3px;border-radius:6px}
.ix-monthrow .chev{flex:none;width:0;height:0;border-left:4px solid transparent;border-right:4px solid transparent;border-top:5px solid #a9b5c4;transition:transform .16s ease}
.ix-monthrow[aria-expanded="false"] .chev{transform:rotate(-90deg)}
.ix-monthrow i{flex:1;height:1px;background:linear-gradient(90deg,#e4ebf3,rgba(228,235,243,0))}
.ix-weekrow.is-folded{display:none}
html[data-theme="dark"] .ix-monthrow span{color:#93a1b2}
html[data-theme="dark"] .ix-monthrow:hover span{color:#e7edf5}
html[data-theme="dark"] .ix-monthrow .chev{border-top-color:#6b7a8d}
html[data-theme="dark"] .ix-monthrow i{background:linear-gradient(90deg,#2b3646,rgba(43,54,70,0))}
.ix-dowrow,.ix-weekrow{display:grid;grid-template-columns:40px minmax(0,1fr);gap:10px}
.ix-dowrow{margin-bottom:8px;position:sticky;top:0;z-index:3;padding:6px 0 5px;background:linear-gradient(180deg,#f6f9fc 62%,rgba(246,249,252,0))}
html[data-theme="dark"] .ix-dowrow{background:linear-gradient(180deg,#0f151d 62%,rgba(15,21,29,0))}
.ix-days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;min-width:0}
.ix-dow{font-size:11px;color:var(--ix-mute);text-align:center;padding:2px 0;font-weight:500}
.ix-dow.is-weekend{color:#a4b0bf}
.ix-weekrow{margin-bottom:6px}
.ix-wk{font-size:10px;color:#a6b1bf;align-self:center;text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.ix-wk.is-now{color:#2f67d8;font-weight:600}
.ix-day{
  position:relative;height:80px;border:1px solid #d4dfeb;border-radius:9px;padding:8px 10px 9px;
  background:#fff;display:flex;flex-direction:column;font:inherit;color:var(--ix-sub);
  cursor:pointer;text-align:left;transition:border-color .14s,background-color .14s,box-shadow .14s;
  -webkit-tap-highlight-color:transparent;
}
.ix-day:hover{border-color:#b4c9e2;box-shadow:0 2px 10px rgba(31,45,66,.07)}
.ix-day.is-future:hover{background:#f3f7fb}
.ix-day.is-future.is-weekend:hover{background:#e3ebf6}
.ix-day:focus-visible{outline:2px solid rgba(47,103,216,.5);outline-offset:1px}
.ix-day-top{display:flex;align-items:flex-start;justify-content:space-between;gap:6px;min-width:0}
.ix-day b{font-size:12px;font-weight:600;color:#4a5a70;line-height:1.2;font-variant-numeric:tabular-nums}
.ix-day-mood{font-size:16px;line-height:1;filter:grayscale(.08);margin-top:-2px}
.ix-day .t{margin-top:4px;font-size:10.5px;color:var(--ix-mute);letter-spacing:-.01em;font-variant-numeric:tabular-nums;white-space:nowrap}
.ix-day .t i{font-style:normal;color:#c2ccd8}
.ix-day-bottom{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:8px;min-width:0}
.ix-day .ix-load{flex:none;width:68px;height:4px;border-radius:99px;background:#e2e9f2;overflow:hidden}
.ix-day .ix-load i{display:block;height:100%;border-radius:99px;transition:width .2s ease,background-color .2s ease}
.ix-day .h{font-size:9.5px;color:var(--ix-mute);font-variant-numeric:tabular-nums;letter-spacing:.01em}
.ix-day .mo{font-size:9px;font-weight:500;color:var(--ix-mute);letter-spacing:0}
.ix-day.is-weekend{background:#eef4fb}
.ix-day.is-future{background:#f4f8fc;border-color:#e1eaf4;color:#a3aebc}
.ix-day.is-future b{color:#93a0b1}
.ix-day.is-future.is-weekend{background:#e3ebf6;border-color:#d9e4f1}
.ix-day.is-future.is-weekend b{color:#8d9aac}
.ix-day.is-past.is-weekend{background:#eef4fb}
.ix-day.is-logged{border-color:#cfdcec}
.ix-day.is-logged b{color:var(--ix-ink)}
.ix-day.is-today{border-color:#2f67d8;box-shadow:0 0 0 1px rgba(47,103,216,.25)}
.ix-day.is-today b{color:#2f67d8}
.ix-day.is-sel{border-color:#2f67d8;box-shadow:0 0 0 1.5px #2f67d8,0 10px 22px rgba(47,103,216,.14)}
.ix-day.is-out{border-color:transparent;background:transparent;cursor:default;opacity:.4}
.ix-day.is-out b{color:#c3ccd8}
html[data-theme="dark"] .ix-day{background:#141c27;border-color:#2b3646;color:#a9b5c4}
html[data-theme="dark"] .ix-day:hover{background:#1a2431;border-color:#3a4b60}
html[data-theme="dark"] .ix-day b{color:#c4cfdd}
html[data-theme="dark"] .ix-day.is-weekend{background:#1a2432}
html[data-theme="dark"] .ix-day.is-future{background:#0f1620;border-color:#1f2937;color:#7f8c9d}
html[data-theme="dark"] .ix-day.is-future b{color:#66748a}
html[data-theme="dark"] .ix-day.is-future.is-weekend{background:#0b1119;border-color:#1a2330}
html[data-theme="dark"] .ix-day.is-future.is-weekend b{color:#5d6a7d}
html[data-theme="dark"] .ix-day.is-future:hover{background:#161e29}
html[data-theme="dark"] .ix-day.is-future.is-weekend:hover{background:#131a23}
html[data-theme="dark"] .ix-day.is-logged{background:#1a2432;border-color:#31405a}
html[data-theme="dark"] .ix-day.is-logged b{color:#e7edf5}
html[data-theme="dark"] .ix-day.is-today{border-color:#6f9fe8;box-shadow:0 0 0 1px rgba(111,159,232,.3)}
html[data-theme="dark"] .ix-day.is-today b{color:#8db3ff}
html[data-theme="dark"] .ix-day.is-sel{border-color:#6f9fe8;box-shadow:0 0 0 1.5px #6f9fe8,0 10px 24px rgba(0,0,0,.4)}
html[data-theme="dark"] .ix-day.is-out b{color:#4a5667}

/* ---------- 当日浮窗 ---------- */
.ix-pop{
  position:fixed;z-index:79;width:336px;padding:15px 16px 15px;border-radius:16px;
  background:#fff;border:1px solid #dfe7f1;box-shadow:0 20px 54px rgba(15,29,50,.20),0 2px 8px rgba(15,29,50,.06);
  visibility:hidden;
}
.ix-pop.is-ready{visibility:visible}
.ix-pop-head{display:flex;align-items:flex-start;gap:10px}
.ix-pop-title b{display:block;font-size:18px;font-weight:700;letter-spacing:-.01em;color:var(--ix-ink);font-variant-numeric:tabular-nums;line-height:1.25}
.ix-pop-title span{display:block;font-size:11px;color:var(--ix-mute);margin-top:5px;font-variant-numeric:tabular-nums}
.ix-pop-close{margin-left:auto;border:0;background:transparent;color:#9aa5b4;font-size:18px;line-height:1;cursor:pointer;padding:2px 5px;border-radius:7px}
.ix-pop-close:hover{background:#f2f6fb;color:#3f4b5e}
.ix-pop-times{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.ix-pop-field{display:flex;flex-direction:column;gap:7px;margin-top:15px}
.ix-pop-times .ix-pop-field{margin-top:0}
.ix-pop-field>span{font-size:11px;color:var(--ix-mute);letter-spacing:.01em}
.ix-timebox{display:flex;align-items:center;justify-content:space-between;gap:6px;height:38px;padding:0 10px;border:1px solid #d7e1ed;border-radius:10px;background:#fff;width:100%;cursor:pointer;transition:border-color .14s,box-shadow .14s}
.ix-timebox:hover{border-color:#bdd0e6}
.ix-timebox:focus-within{border-color:#9db8ff;box-shadow:0 0 0 3px rgba(59,115,245,.10)}
.ix-timebox input{flex:1;min-width:0;border:0;background:transparent;outline:none;font:inherit;font-size:14px;font-weight:600;color:var(--ix-ink);font-variant-numeric:tabular-nums;padding:0;cursor:pointer}
.ix-timebox input::-webkit-calendar-picker-indicator{display:none}
.ix-timebox .ci{flex:none;border:0;background:transparent;color:#98a7ba;padding:0;display:flex;cursor:pointer}
.ix-timebox .ci svg{width:14px;height:14px}
.ix-pop-line{display:flex;align-items:center;justify-content:space-between;gap:14px}
.ix-loadbar{position:relative;flex:1;height:10px;border-radius:99px;background:#e4eaf2}
.ix-loadbar .fill{position:absolute;left:0;top:0;bottom:0;width:var(--pct,0%);border-radius:99px;background:var(--c,#4d8fcf);transition:width .2s ease,background-color .2s ease}
.ix-loadbar .hits{position:absolute;inset:-6px 0;display:flex}
.ix-loadbar .hits button{flex:1;border:0;background:transparent;padding:0;cursor:pointer}
.ix-loadbar .hits button:hover~button{background:none}
.ix-pop-line .n{font-size:11.5px;color:var(--ix-mute);font-style:normal;font-variant-numeric:tabular-nums;flex:none}
.ix-moods{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.ix-moods button{height:38px;display:flex;align-items:center;justify-content:center;border:0;background:transparent;border-radius:50%;font-size:21px;line-height:1;cursor:pointer;filter:grayscale(.55);opacity:.62;transition:background-color .14s,filter .14s,opacity .14s,box-shadow .14s}
.ix-moods button:hover{background:#f0f5fb;opacity:.95}
.ix-moods button.on{background:#e8f0fd;filter:none;opacity:1;box-shadow:inset 0 0 0 1.5px #9dbcf3;border-radius:9px}
.ix-pop-foot{display:flex;align-items:center;gap:10px;margin-top:18px}
.ix-pop-foot .ix-btn.primary{flex:1;height:37px;font-size:13px}
.ix-pop-del{margin-right:auto;color:#a36868;font-size:12px}
.ix-pop-del:hover{color:#b3261e}
html[data-theme="dark"] .ix-pop{background:#1b2431;border-color:#31405a;box-shadow:0 20px 54px rgba(0,0,0,.5)}
html[data-theme="dark"] .ix-pop-title b{color:#e7edf5}
html[data-theme="dark"] .ix-pop-close{color:#8b98a8}
html[data-theme="dark"] .ix-pop-close:hover{background:#26303f;color:#e7edf5}
html[data-theme="dark"] .ix-timebox{background:#141c27;border-color:#33445c}
html[data-theme="dark"] .ix-timebox:hover{border-color:#43597a}
html[data-theme="dark"] .ix-timebox input{color:#e7edf5}
html[data-theme="dark"] .ix-timebox .ci{color:#7f8d9e}
html[data-theme="dark"] .ix-day .ix-load{background:#2a3543}
html[data-theme="dark"] .ix-loadbar{background:#2a3543}
html[data-theme="dark"] .ix-moods button:hover{background:#202c3b}
html[data-theme="dark"] .ix-moods button.on{background:#22304a;box-shadow:inset 0 0 0 1.5px #4a76bf}
html[data-theme="dark"] .ix-pop-del{color:#d29a9a}
html[data-theme="dark"] .ix-pop-del:hover{color:#f0b4b4}
@media(max-width:760px){
  .ix-pop{left:12px!important;right:12px;bottom:14px;top:auto!important;width:auto;transform:translateY(10px)}
  .ix-pop.is-ready{transform:none}
}

/* ---------- 周报 ---------- */
/* ---------- 周报 ---------- */
.ix-rep{max-width:1120px}
.ix-weekstrip{position:relative;display:flex;align-items:center;justify-content:space-between;gap:6px;padding:12px 0 2px}
.ix-weekstrip:before{content:"";position:absolute;left:15px;right:15px;top:calc(50% + 3px);height:1px;background:#e4ebf3}
.ix-wd{position:relative;z-index:1;flex:none;width:32px;height:32px;border-radius:50%;border:1px solid #d7e1ed;background:#fff;color:#9aa7b7;font:inherit;font-size:11.5px;font-weight:600;font-variant-numeric:tabular-nums;cursor:pointer;display:grid;place-items:center;padding:0;transition:border-color .14s,background-color .14s,color .14s;-webkit-tap-highlight-color:transparent}
.ix-wd:hover{border-color:#a9c1e2;color:#3d4d64}
.ix-wd.is-pending{border-color:#ddbc6a;background:#fdf8ec;color:#8a6d1f}
.ix-wd.is-evaluated{border-color:#c2d3ef;background:#eef3fb;color:#2f67d8}
.ix-wd.is-missing{color:#b3bfcd}
.ix-wd.is-future{opacity:.5}
.ix-wd.is-current{box-shadow:0 0 0 2px rgba(47,103,216,.18)}
.ix-wd.is-on{background:#2f67d8;border-color:#2f67d8;color:#fff;box-shadow:none}
.ix-week-head{display:flex;align-items:baseline;gap:12px;margin:30px 2px 18px}
.ix-week-head h2{font-size:20px;font-weight:700;letter-spacing:-.02em;color:var(--ix-ink);margin:0}
.ix-week-head span{font-size:12px;color:var(--ix-mute);font-variant-numeric:tabular-nums}
.ix-week-cards{display:grid;grid-template-columns:360px minmax(0,1fr);gap:28px;align-items:stretch}
.ix-mon{min-width:0;display:flex}
.ix-mon-card{position:relative;flex:1;display:flex;flex-direction:column;overflow:hidden;border-radius:18px;padding:26px 24px 20px;min-width:0;min-height:380px;color:#EAF1FB;
  background:
    radial-gradient(240px circle at var(--gx,50%) var(--gy,50%),rgba(255,255,255,.11),rgba(255,255,255,0) 70%),
    radial-gradient(120% 90% at 100% 0%,rgba(92,134,224,.5),rgba(92,134,224,0) 62%),
    radial-gradient(90% 80% at 0% 100%,rgba(232,200,122,.16),rgba(232,200,122,0) 60%),
    linear-gradient(155deg,#0F1A2C 0%,#17263F 52%,#1E3A63 100%);
  box-shadow:0 16px 36px rgba(13,25,44,.26),inset 0 0 0 1px rgba(255,255,255,.07);
  transition:transform .18s ease-out,box-shadow .18s ease-out;
  transform-style:preserve-3d;
}
.ix-mon-card.is-tilting{transition:transform .09s linear,box-shadow .18s ease-out}
.ix-mon-card:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg,rgba(255,255,255,.035) 0 1px,rgba(255,255,255,0) 1px 7px);pointer-events:none}
.ix-mon-card:after{content:attr(data-month);position:absolute;right:-12px;bottom:-44px;font-family:"Songti SC","Noto Serif SC",serif;font-size:180px;font-weight:700;line-height:1;color:rgba(255,255,255,.05);pointer-events:none}
.ix-mon-top{position:relative;z-index:1;display:flex;align-items:center;justify-content:space-between;gap:8px}
.ix-mon-top b{font-family:"Songti SC","Noto Serif SC",serif;font-size:19px;font-weight:600;letter-spacing:.16em;color:#EFD9A6}
.ix-mon-lock{display:flex;color:rgba(233,242,255,.45)}
.ix-mon-lock svg{width:15px;height:15px}
.ix-mon-slogan{position:relative;z-index:1;margin:19px 0 0;font-family:"Songti SC","Noto Serif SC",serif;font-size:26px;line-height:1.68;letter-spacing:.01em;color:#FBF4E4;text-wrap:balance}
.ix-mon-rule{position:relative;z-index:1;height:1px;margin:20px 0 0;background:linear-gradient(90deg,rgba(232,200,122,.75),rgba(232,200,122,0))}
.ix-mon-hours{position:relative;z-index:1;margin-top:20px;font-family:"DIN Alternate","SF Pro Display",-apple-system,"PingFang SC",sans-serif;font-size:44px;font-weight:700;letter-spacing:-.02em;color:#FFFFFF;font-variant-numeric:tabular-nums;line-height:.95}
.ix-mon-hours small{margin-left:9px;font-size:13px;font-weight:500;font-family:-apple-system,"PingFang SC",sans-serif;letter-spacing:.08em;color:rgba(214,228,246,.6)}
.ix-mon-avg{position:relative;z-index:1;margin-top:13px;font-size:12.5px;color:#8FA2BC;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.ix-mon-avg em{font-style:normal;font-size:12.5px;color:#C6D3E6;margin-right:9px;letter-spacing:.04em}
.ix-mon-moods{position:relative;z-index:1;display:flex;flex-wrap:wrap;gap:9px;margin-top:18px}
.ix-mon-moods .ix-mood-chip{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:9px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.07);font-size:15px;line-height:1;color:#DCE6F5}
.ix-mon-moods .ix-mood-chip i{font-style:normal;font-size:11px;color:#8CA0BC;font-variant-numeric:tabular-nums}
.ix-mon-actions{position:relative;z-index:1;margin-top:auto;padding-top:20px;display:flex;gap:10px}
.ix-mon-actions button{border:1px solid rgba(255,255,255,.17);background:rgba(255,255,255,.05);color:#DCE6F5;font:inherit;font-size:12px;letter-spacing:.08em;padding:7px 17px;border-radius:99px;cursor:pointer;transition:background-color .16s,border-color .16s}
.ix-mon-actions button:hover{background:rgba(255,255,255,.13);border-color:rgba(255,255,255,.32)}
.ix-mon-actions .ix-mon-detail{border-color:rgba(232,200,122,.38);background:rgba(232,200,122,.08);color:#F0DCAE}
.ix-mon-actions .ix-mon-detail:hover{background:rgba(232,200,122,.15);border-color:rgba(232,200,122,.58)}
.ix-rep-right{min-width:0;display:flex;flex-direction:column;justify-content:center;gap:24px;background:var(--ix-surface);border-radius:18px;padding:26px 28px 24px;box-shadow:0 2px 14px rgba(31,45,66,.06)}
.ix-rep-right.is-empty{justify-content:flex-start}
html[data-theme="dark"] .ix-rep-right{box-shadow:0 2px 14px rgba(0,0,0,.3)}
.ix-rep-status{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.ix-rep-status b{font-size:36px;font-weight:700;letter-spacing:-.04em;color:var(--ix-ink);font-variant-numeric:tabular-nums;line-height:1.05}
.ix-rep-status b.is-plain{font-size:20px;font-weight:600;letter-spacing:-.01em;color:#95a3b3}
.ix-rep-status.is-pending b.is-plain{color:#b08a2e}
html[data-theme="dark"] .ix-rep-status b.is-plain{color:#7f8c9d}
html[data-theme="dark"] .ix-rep-status.is-pending b.is-plain{color:#d9b96a}
.ix-rep-status em{font-style:normal;font-size:11.5px;color:var(--ix-mute);font-variant-numeric:tabular-nums}
.ix-rep-status span{font-size:12px;color:#27845e;font-weight:600;margin-left:4px}
html[data-theme="dark"] .ix-rep-status span{color:#6fd2a3}
.ix-rep-status p{margin:14px 0 0;font-size:13px;line-height:1.9;color:var(--ix-sub)}
.ix-rep-sub{display:flex;flex-direction:column;padding-top:20px;border-top:1px solid #eef2f8}
html[data-theme="dark"] .ix-rep-sub{border-top-color:#28323f}
.ix-rep-right.is-empty .ix-rep-sub{flex:1;padding-top:0;border-top:0}
.ix-rep-right.is-empty .ix-upload{flex:1;min-height:0;justify-content:center}
.ix-rep-right .ix-file{margin-top:0;max-width:none}
.ix-rep-right .ix-upload{margin-top:0;max-width:none}
.ix-rep-sub .ix-upload{min-height:120px;justify-content:center}
.ix-note{margin:16px 0 0;font-size:12.5px;line-height:1.8;color:var(--ix-mute)}

.ix-file{display:flex;align-items:center;gap:11px;padding:15px 17px;background:var(--ix-surface);border-radius:12px;box-shadow:0 2px 10px rgba(31,45,66,.05);max-width:560px}
.ix-file .ic{display:flex;color:#2f6fed;flex:none}
.ix-file .ic svg{width:24px;height:24px}
.ix-file .nm{font-size:13px;font-weight:600;color:var(--ix-ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.ix-file .sz{font-size:11px;color:var(--ix-mute);flex:none;font-variant-numeric:tabular-nums}
.ix-file .ix-link{margin-left:auto;flex:none}
.ix-file .ix-link+.ix-link{margin-left:0}
.ix-upload{display:flex;align-items:center;gap:11px;padding:26px 20px;border-radius:13px;border:1px dashed #cfdbeb;background:rgba(255,255,255,.42);font:inherit;font-size:13px;color:var(--ix-sub);cursor:pointer;transition:border-color .16s,background-color .16s;width:100%;max-width:440px}
.ix-upload:hover{border-color:#a9c1e2;background:#fff}
html[data-theme="dark"] .ix-upload{background:rgba(255,255,255,.03);border-color:#33455c}
html[data-theme="dark"] .ix-upload:hover{background:#202935}
.ix-upload .plus{width:27px;height:27px;border-radius:50%;background:#fff;display:grid;place-items:center;color:#4a7ce0;box-shadow:0 1px 4px rgba(31,45,66,.10);flex:none}
html[data-theme="dark"] .ix-upload .plus{background:#263341}
.ix-upload .plus svg{width:13px;height:13px}
html[data-theme="dark"] .ix-wd{background:#141c27;border-color:#2b3646;color:#7f8c9d}
html[data-theme="dark"] .ix-wd:hover{border-color:#3a4b60;color:#c4cfdd}
html[data-theme="dark"] .ix-wd.is-pending{background:#2a2415;border-color:#6b5a2a;color:#d9b96a}
html[data-theme="dark"] .ix-wd.is-evaluated{background:#1a2536;border-color:#31486a;color:#8db3ff}
html[data-theme="dark"] .ix-wd.is-on{background:#3b73f5;border-color:#3b73f5;color:#fff}
html[data-theme="dark"] .ix-weekstrip:before{background:#28323f}
html[data-theme="dark"] .ix-mon b{color:#c4cfdd}

}

  .ix-weekstrip{flex-wrap:wrap;justify-content:flex-start;gap:10px 8px;padding-top:4px}

/* ---------- 作品 ---------- */
.ix-works{display:flex;flex-direction:column}
.ix-sort{display:inline-flex;align-items:center;gap:2px;height:32px;padding:2px;border-radius:9px;background:#fff;border:1px solid #dfe7f1}
.ix-sort button{border:0;background:transparent;font:inherit;font-size:11.5px;color:#7f8d9f;height:26px;padding:0 11px;border-radius:7px;cursor:pointer;transition:background-color .14s,color .14s;line-height:1}
.ix-sort button:hover{color:#3d4d64}
.ix-sort button.is-on{background:#eef3fb;color:#2f67d8;font-weight:600}
html[data-theme="dark"] .ix-sort{background:#1c2431;border-color:#2b3a4d}
html[data-theme="dark"] .ix-sort button{color:#8b98a8}
html[data-theme="dark"] .ix-sort button:hover{color:#c4cfdd}
html[data-theme="dark"] .ix-sort button.is-on{background:#22303f;color:#9cc2f5}
.ix-shelf{display:grid;grid-template-columns:58px minmax(0,1fr);gap:22px;align-items:end;margin-bottom:26px}
.ix-shelf-label{display:flex;align-items:center;justify-content:flex-end;gap:6px;font-size:11px;font-weight:600;color:#7f8d9f;letter-spacing:.1em;padding-bottom:23px;white-space:nowrap;text-align:right}
.ix-shelf-label:before{content:"";width:6px;height:6px;border-radius:50%;background:var(--spine,#9db4d6);flex:none}
.ix-shelf-books{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;border-bottom:1px solid #e7edf5;padding:2px 2px 18px;min-width:0}
.ix-book{position:relative;flex:none;width:156px;height:198px;border:0;border-radius:12px;cursor:pointer;font:inherit;text-align:left;overflow:hidden;padding:0;display:flex;flex-direction:column;background:var(--ix-surface);
  box-shadow:0 1px 2px rgba(31,45,66,.05),0 7px 18px rgba(31,45,66,.07);
  transition:transform .18s ease-out,box-shadow .18s ease-out;
  transform-style:preserve-3d;
}
.ix-book:hover{box-shadow:0 2px 4px rgba(31,45,66,.06),0 20px 36px rgba(31,45,66,.15)}
.ix-book.is-tilting{transition:transform .09s linear,box-shadow .18s ease-out}
.ix-book:focus-visible{outline:2px solid rgba(47,103,216,.45);outline-offset:2px}
.ix-book-cover{position:relative;display:block;flex:none;height:100px;overflow:hidden}
.ix-book-cover:after{content:"";position:absolute;inset:0;background:radial-gradient(130% 100% at 18% 0%,rgba(255,255,255,.24),rgba(255,255,255,0) 58%)}
.ix-book-glyph{position:absolute;left:12px;bottom:0;font-family:"DIN Alternate","SF Pro Display",-apple-system,sans-serif;font-size:54px;font-weight:700;line-height:1.02;letter-spacing:-.02em;color:rgba(255,255,255,.94);pointer-events:none;font-variant-numeric:tabular-nums}
.ix-book-glyph i{font-style:normal;font-size:15px;font-weight:500;letter-spacing:.02em;margin-left:2px;opacity:.78}
.ix-book-week{position:absolute;right:12px;top:10px;font-size:10px;letter-spacing:.06em;color:rgba(255,255,255,.8);font-variant-numeric:tabular-nums;pointer-events:none}
.ix-book-body{display:flex;flex-direction:column;flex:1;min-width:0;padding:11px 13px 12px}
.ix-book-title{font-family:"Songti SC","Noto Serif SC",serif;font-size:13.5px;font-weight:600;line-height:1.52;color:var(--ix-ink);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ix-book-meta{margin-top:auto;display:flex;flex-direction:column;gap:3px;padding-top:8px;font-size:9.5px;color:var(--ix-mute);min-width:0;font-variant-numeric:tabular-nums}
.ix-book-meta span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
html[data-theme="dark"] .ix-book{box-shadow:0 1px 2px rgba(0,0,0,.22),0 7px 18px rgba(0,0,0,.25)}
html[data-theme="dark"] .ix-book:hover{box-shadow:0 2px 4px rgba(0,0,0,.28),0 20px 36px rgba(0,0,0,.4)}
.ix-book-add{flex:none;width:160px;height:178px;border:1px dashed #cfdbeb;border-radius:12px;background:rgba(255,255,255,.42);color:var(--ix-sub);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:11px;font:inherit;font-size:12px;cursor:pointer;transition:border-color .16s,background-color .16s}
.ix-book-add:hover{border-color:#a9c1e2;background:#fff}
.ix-book-add .plus{width:29px;height:29px;border-radius:50%;background:#fff;display:grid;place-items:center;color:#4a7ce0;box-shadow:0 1px 4px rgba(31,45,66,.10)}
.ix-book-add .plus svg{width:13px;height:13px}
html[data-theme="dark"] .ix-shelf-label{color:#93a1b2}
html[data-theme="dark"] .ix-shelf-books{border-bottom-color:#28323f}
html[data-theme="dark"] .ix-book{box-shadow:0 2px 10px rgba(0,0,0,.25)}
html[data-theme="dark"] .ix-book:hover{box-shadow:0 14px 28px rgba(0,0,0,.4)}
html[data-theme="dark"] .ix-book-add{border-color:#33455c;background:rgba(255,255,255,.03);color:#a9b5c4}
html[data-theme="dark"] .ix-book-add:hover{border-color:#43597a;background:#202935}
html[data-theme="dark"] .ix-book-add .plus{background:#263341;color:#9cc2f5}
.ix-works-empty{display:flex;justify-content:center;padding:40px 0}
.ix-works-empty .ix-upload{margin-top:0}
/* 作品详情 */
.ix-work-detail-meta{display:flex;gap:8px;flex-wrap:wrap;margin:2px 0 16px;font-size:11px;color:var(--ix-mute)}
.ix-work-detail-meta span{background:var(--ix-soft,#f2f6fb);border-radius:6px;padding:3px 8px}
.ix-work-link{margin-top:12px;font-size:12.5px;color:#2f67d8;word-break:break-all}
.ix-modal .ix-file{background:#f5f8fc;box-shadow:none}
html[data-theme="dark"] .ix-modal .ix-file{background:#141c27}

/* ---------- 弹窗 ---------- */
.ix-modal .field-label{margin-top:12px;margin-bottom:6px}
.ix-modal input[type="file"]{padding:9px 11px;font-size:12.5px;color:var(--ix-mute)}
.ix-modal input[type="file"]::file-selector-button{margin-right:12px;border:0;border-radius:8px;padding:7px 14px;background:#eef3fb;color:#2f67d8;font:inherit;font-size:12px;font-weight:600;cursor:pointer}
html[data-theme="dark"] .ix-modal input[type="file"]::file-selector-button{background:#22303f;color:#9cc2f5}
.ix-modal .field-label:first-of-type{margin-top:0}
.ix-form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ix-summary-count{display:flex;align-items:baseline;gap:8px;margin-bottom:14px}
.ix-summary-count b{font-size:30px;font-weight:700;letter-spacing:-.03em;color:var(--ink);font-variant-numeric:tabular-nums;line-height:1}
.ix-summary-count span{font-size:12px;color:var(--mute)}
.ix-summary-count em{margin-left:auto;font-style:normal;font-size:11px;color:#4a6f9f;background:var(--soft);border-radius:5px;padding:2px 7px}
.ix-summary-list{list-style:none;margin:0;padding:0;max-height:280px;overflow-y:auto;display:flex;flex-direction:column;gap:2px}
.ix-summary-list li{display:flex;gap:10px;padding:7px 6px;font-size:12.5px;color:var(--ink);border-radius:7px}
.ix-summary-list li:hover{background:var(--card-soft)}
.ix-summary-list li span{flex:none;font-size:10.5px;color:var(--mute);min-width:52px;padding-top:2px;font-variant-numeric:tabular-nums}

/* ---------- Onboarding ---------- */
.ix-start{display:flex;flex-direction:column;align-items:center;gap:24px;padding:48px 0 60px;text-align:center}
.ix-start h1{font-size:30px;font-weight:750;letter-spacing:-.02em;color:var(--ink);margin:0}

  function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
  function formatDate(d){return d?String(d).replaceAll('-','.'):'待定'}
  function formatSize(bytes){if(!bytes)return '';return bytes<1024*1024?Math.round(bytes/1024)+' KB':(bytes/1024/1024).toFixed(1)+' MB'}
  function addWeeks(dateStr,n){const d=new Date(dateStr+'T00:00:00');d.setDate(d.getDate()+n*7);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
  function weeksSince(dateStr){const start=new Date(dateStr+'T00:00:00');const today=new Date('2026-10-29T00:00:00');return Math.max(0,Math.floor((today-start)/86400000/7))}

  function publishAnnouncement(event){
    event.preventDefault();
    const form=new FormData(event.target);
    const title=String(form.get('title')||'').trim();
    const content=String(form.get('content')||'').trim();
    if(!title||!content){toast('请填写公告标题和正文');return}
    const now=new Date();
    const publishedAt=now.toLocaleString('zh-CN',{hour12:false});
    if(state.announcementEditingId){
      const item=state.announcements.find(announcement=>announcement.id===state.announcementEditingId);
      if(item)Object.assign(item,{title,content,publishedAt,updatedAt:now.toISOString(),status:'published'});
    }else{
      state.announcements.unshift({id:'announcement-'+now.getTime(),title,content,publishedAt,updatedAt:now.toISOString(),status:'published'});
    }
    state.announcementEditorOpen=false;
    state.announcementEditingId=null;
    state.announcementDraft={title:'',content:''};
    saveDemoAnnouncements();
    toast('公告已发布，学生端已更新');
    render();
  }

  async function loadSettingsMemory(){
    const request=++settingsMemoryRequest;
    try{
      const data=await api('/api/memory');
      if(request!==settingsMemoryRequest)return;
      state.settingsMemory={status:data&&data.enabled?'enabled':'disabled',count:Array.isArray(data&&data.items)?data.items.length:0};
    }catch{
      if(request!==settingsMemoryRequest)return;
      state.settingsMemory={status:'error',count:0};
    }
    if(location.hash==='#/settings')render();
  }

  let suggestionSeed=0;
  let suggestionItems=ChatSuggestions.normalizeCatalog(ChatSuggestions.defaultCatalog).filter(item=>item.kind==='prompt').slice(0,3);
  let suggestionsEntrancePlayed=false;
  let suggestionFlashTimer=null;
  let suggestionDealing=false;
  let suggestionDealTimer=null;
  const suggestionFinePointer=window.matchMedia('(hover: hover) and (pointer: fine)');
  function suggestionTiltEnabled(){return window.innerWidth>760&&suggestionFinePointer.matches&&!assistantMotion.matches}
  function assistantSuggestionPrompts(){
    const prompts=suggestionItems.filter(item=>item.kind==='prompt'&&item.prompt).map(item=>item.prompt);
    if(prompts.length)return prompts;
    return ChatSuggestions.defaultCatalog.filter(item=>item.kind==='prompt'&&item.prompt).map(item=>item.prompt);
  }
  let assistantTypingTimer=null;
  let assistantTypingIndex=0;
  let assistantTypingLength=0;
  let assistantTypingDeleting=false;
  const assistantMotion=window.matchMedia('(prefers-reduced-motion: reduce)');
  function stopAssistantTyping(){clearTimeout(assistantTypingTimer);assistantTypingTimer=null}
  function startAssistantTyping(){
    stopAssistantTyping();
    const input=document.getElementById('chatInput');
    const text=document.querySelector('.assistant-typing-text');
    const wrapper=document.querySelector('.assistant-typing');
    if(!input||!text||!wrapper||input.value||state.chat.uploads.length||state.chat.uploadDragDepth||document.activeElement===input||document.getElementById('assistantCompose')?.classList.contains('is-multiline'))return;
    wrapper.hidden=false;
    const prompts=assistantSuggestionPrompts();
    if(assistantMotion.matches){text.textContent=prompts[0];return}
    if(assistantTypingIndex>=prompts.length)assistantTypingIndex=0;
    const prompt=prompts[assistantTypingIndex];
    assistantTypingLength+=assistantTypingDeleting?-1:1;
    text.textContent=prompt.slice(0,assistantTypingLength);
    let delay=assistantTypingDeleting?45:95;
    if(!assistantTypingDeleting&&assistantTypingLength>=prompt.length){assistantTypingDeleting=true;delay=1800}
    else if(assistantTypingDeleting&&assistantTypingLength<=0){assistantTypingDeleting=false;assistantTypingIndex=(assistantTypingIndex+1)%prompts.length;delay=450}
    assistantTypingTimer=setTimeout(startAssistantTyping,delay);
  }

  window.addEventListener('resize',()=>{document.querySelectorAll('.assistant-question-input').forEach(resizeChatTextarea);refreshUploadUi();updateComposerLayout()});
  function assistantInputChanged(input){state.chat.input=input.value;const hint=document.querySelector('.assistant-typing');if(hint)hint.hidden=!!input.value;if(input.value)stopAssistantTyping();updateComposerLayout()}
  function assistantSpotlight(event){if(!event.currentTarget.classList.contains('is-home')||event.pointerType==='touch'||assistantMotion.matches)return;const bounds=event.currentTarget.getBoundingClientRect();event.currentTarget.style.setProperty('--spot-x',`${event.clientX-bounds.left}px`);event.currentTarget.style.setProperty('--spot-y',`${event.clientY-bounds.top}px`);event.currentTarget.style.setProperty('--spot-opacity','1')}
  function clearAssistantSpotlight(event){event.currentTarget.style.setProperty('--spot-opacity','0')}
  assistantMotion.addEventListener('change',()=>{stopAssistantTyping();startAssistantTyping()});
  function suggestionIconHtml(icon){return ICONS[icon]||ICONS.spark}
  const suggestionTiltState=new WeakMap();
  function tiltSuggestion(event){
    if(!suggestionTiltEnabled())return;
    const pill=event.currentTarget,bounds=pill.getBoundingClientRect();
    let state=suggestionTiltState.get(pill);
    if(!state){state={raf:null,px:0,py:0};suggestionTiltState.set(pill,state)}
    state.px=(event.clientX-bounds.left)/Math.max(1,bounds.width)-.5;
    state.py=(event.clientY-bounds.top)/Math.max(1,bounds.height)-.5;
    if(state.raf)return;
    state.raf=requestAnimationFrame(()=>{
      state.raf=null;
      const limit=value=>Math.max(-6,Math.min(6,value));
      const rotateX=limit(-state.py*4),rotateY=limit(state.px*5);
      pill.style.transform=`rotateX(${rotateX.toFixed(2)}deg) rotateY(${rotateY.toFixed(2)}deg)`;
      pill.style.setProperty('--gx',`${((state.px+.5)*100).toFixed(1)}%`);
      pill.style.setProperty('--gy',`${((state.py+.5)*100).toFixed(1)}%`);
      pill.dataset.tilted='true';
    });
  }
  function resetSuggestionTilt(event){
    const pill=event.currentTarget,state=suggestionTiltState.get(pill);
    if(state&&state.raf){cancelAnimationFrame(state.raf);state.raf=null}
    pill.style.transform='';
    pill.style.setProperty('--gx','50%');
    pill.style.setProperty('--gy','0%');
    delete pill.dataset.tilted;
  }
  function suggestionCardHtml(item,index){
    const tiltAttrs=suggestionTiltEnabled()?' onpointermove="tiltSuggestion(event)" onpointerleave="resetSuggestionTilt(event)"':'';
    return `<button type="button" class="assistant-suggestion-pill" style="--index:${index}" data-suggestion-id="${esc(item.id)}" onclick="activateSuggestion('${esc(item.id)}')"${tiltAttrs}><span class="assistant-suggestion-glare" aria-hidden="true"></span>${suggestionIconHtml(item.icon)}<span class="assistant-suggestion-label">${safeText(item.title)}</span></button>`;
  }
  let suggestionEntranceTimer=null;
  function scheduleSuggestionEntranceCleanup(){
    const grid=document.getElementById('suggestionGrid');
    if(!grid||!grid.classList.contains('is-entering'))return;
    clearTimeout(suggestionEntranceTimer);
    suggestionEntranceTimer=setTimeout(()=>{document.getElementById('suggestionGrid')?.classList.remove('is-entering')},420);
  }
  function suggestionRefreshHtml(){
    return `<button type="button" class="assistant-suggestions-refresh" onclick="shuffleSuggestions()" aria-label="换一批"${suggestionDealing?' disabled aria-busy="true"':''}>${ICONS.refresh}</button>`;
  }
  function suggestionCardsHtml(entrance=false){
    return `<div class="assistant-suggestions${entrance?' is-entering':''}" id="suggestionGrid" aria-label="灵感推荐">${suggestionItems.map(suggestionCardHtml).join('')}${suggestionRefreshHtml()}</div>`;
  }
  function flashComposer(){
    const compose=document.getElementById('assistantCompose');if(!compose)return;
    clearTimeout(suggestionFlashTimer);
    compose.classList.remove('is-suggestion-flash');
    void compose.offsetWidth;
    compose.classList.add('is-suggestion-flash');
    suggestionFlashTimer=setTimeout(()=>compose.classList.remove('is-suggestion-flash'),320);
  }
  function setSuggestionDealing(dealing){
    suggestionDealing=dealing;
    const button=document.querySelector('.assistant-suggestions-refresh');
    if(button){button.disabled=dealing;button.setAttribute('aria-busy',String(dealing))}
    const grid=document.getElementById('suggestionGrid');
    if(grid)grid.setAttribute('aria-busy',String(dealing));
  }
  function activateSuggestion(id){
    if(suggestionDealing)return;
    const position=suggestionItems.findIndex(item=>item.id===id);
    if(position<0)return;
    const resolved=ChatSuggestions.resolveSuggestion(suggestionItems[position]);
    if(!resolved)return;
    window.dispatchEvent(new CustomEvent('assistant-suggestion',{detail:{id:resolved.id,kind:resolved.type,position,scene:'student_home'}}));
    if(resolved.type==='prompt'){fillChatInput(resolved.text);flashComposer();return}
    if(resolved.type==='link'){try{window.open(resolved.url,'_blank','noopener')}catch{toast('链接暂时无法打开')}return}
    if(resolved.actionType==='navigate'&&resolved.path){location.hash='#'+resolved.path;return}
    if(resolved.actionType==='toast'&&resolved.message){toast(resolved.message);return}
    toast('该入口暂未开放');
  }
  function shuffleSuggestions(){
    if(suggestionDealing)return;
    suggestionSeed=ChatSuggestions.nextSeed(suggestionSeed);
    const batch=ChatSuggestions.pickBatch(ChatSuggestions.defaultCatalog,{size:3,seed:suggestionSeed,excludeIds:suggestionItems.map(item=>item.id)});
    suggestionItems=batch.items;
    assistantTypingIndex=0;assistantTypingLength=0;stopAssistantTyping();
    const reveal=()=>{
      const fresh=document.getElementById('suggestionGrid');
      if(!fresh){render();startAssistantTyping();return}
      fresh.classList.remove('is-entering','is-dealing-out');
      fresh.innerHTML=suggestionItems.map(suggestionCardHtml).join('')+suggestionRefreshHtml();
      fresh.classList.add('is-dealing-in');
      startAssistantTyping();
      clearTimeout(suggestionDealTimer);
      suggestionDealTimer=setTimeout(()=>{
        setSuggestionDealing(false);
        const node=document.getElementById('suggestionGrid');
        if(node)node.classList.remove('is-dealing-in');
      },assistantMotion.matches?260:700);
    };
    setSuggestionDealing(true);
    const grid=document.getElementById('suggestionGrid');
    if(!grid||assistantMotion.matches){reveal();return}
    grid.classList.add('is-dealing-out');
    clearTimeout(suggestionDealTimer);

  function handleVolunteerResume(event,index){
    const file=event.target.files?.[0];
    event.target.value='';
    if(!file)return;
    if(!/\.pdf$/i.test(file.name)){toast('请上传 PDF 格式的简历');return}
    if(file.size>10*1024*1024){toast('简历不能超过 10MB');return}
    const old=state.volunteerResumes[index];
    if(old?.url?.startsWith('blob:'))URL.revokeObjectURL(old.url);
    state.volunteerResumes[index]={
      name:old?.name||file.name.replace(/\.pdf$/i,''),
      fileName:file.name,
      size:file.size,
      type:file.type,
      url:URL.createObjectURL(file)
    };
    persistVolunteerState();
    toast('简历已上传');
    render();

  function persistVolunteerApplications(){

      .filter(application=>application[0]===state.volunteerStudentName&&(application[4]==='第一志愿'||application[4]==='第二志愿'))
      .map(application=>application.map((value,index)=>index===6&&typeof value==='string'&&value.startsWith('blob:')?'':value));

  function persistVolunteerState(){
    const resumes=state.volunteerResumes.map(resume=>resume?{...resume,url:resume.url?.startsWith('blob:')?'':resume.url}:null);
    try{
      localStorage.setItem('demo-volunteer-state',JSON.stringify({
        studentName:state.volunteerStudentName,
        submitted:state.volunteerSubmitted,
        submittedAt:state.volunteerSubmittedAt,
        mode:state.volunteerMode,
        choices:state.volunteerChoices,

  function volunteerSubmissionTime(){
    const now=new Date();
    const pad=value=>String(value).padStart(2,'0');
    return {short:`${pad(now.getMonth()+1)}-${pad(now.getDate())} ${pad(now.getHours())}:${pad(now.getMinutes())}`,full:`${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())} ${pad(now.getHours())}:${pad(now.getMinutes())}`};
  }
  // Backend contract: POST /api/student/volunteer-submissions
  function volunteerSubmissionContract(mode,entries,time){
    return {
      version:1,
      studentId:state.studentProfile.studentNo||'',
      studentName:state.volunteerStudentName,
      submissionMode:mode==='self'?'self_application':'college_assignment',
      submittedAt:time.full,
      preferences:entries.map((entry,index)=>({
        priority:index===0?'first':'second',
        jobId:String(entry.jobIndex),
        unit:entry.unit,
        position:entry.title,
        resumeName:entry.resumeName
      })),
      selfConfirmedUnit:null,
      acceptsAdjustment:mode==='self'?null:state.volunteerDraft.adjust==='是',
      reason:mode==='self'?'':state.volunteerDraft.reason
    };
  }
  function submitVolunteer(event){
    event.preventDefault();
    if(state.volunteerSubmitted)return;
    syncVolunteerDraft();
    const mode=state.volunteerMode==='self'?'self':'college';
    const first=volunteerChoice('first');
    const second=volunteerChoice('second');
    if(mode==='college'){
      if(!Number.isInteger(first.jobIndex)){toast('请选择第一志愿');return}
      if(second.jobIndex!==null&&second.jobIndex===first.jobIndex){toast('第一志愿和第二志愿不能相同');return}
      if(!state.volunteerResumes[first.resumeIndex]){toast('请为第一志愿选择简历');return}
      if(Number.isInteger(second.jobIndex)&&!state.volunteerResumes[second.resumeIndex]){toast('请为第二志愿选择简历');return}
    }
    const time=volunteerSubmissionTime();
    state.volunteerStudentName=state.studentProfile.name;
    const entries=[];
    const submissionEntries=[];
    if(mode==='college'){
      for(const [rank,label] of [['first','第一志愿'],['second','第二志愿']]){
        const choice=volunteerChoice(rank);
        if(!Number.isInteger(choice.jobIndex))continue;
        const job=DATA.jobs[choice.jobIndex];
        const resume=state.volunteerResumes[choice.resumeIndex];
        if(!job||!resume)continue;
        entries.push([state.volunteerStudentName,job[1],time.short,'待处理',label,resume.name,resume.url,formatSize(resume.size),job[0],choice.jobIndex,resume.fileName,state.volunteerDraft.adjust,state.volunteerDraft.reason]);
        submissionEntries.push({rank,label,jobIndex:choice.jobIndex,unit:job[0],title:job[1],city:job[2],category:job[5]||'其它',resumeName:resume.name,resumeSize:formatSize(resume.size),fileName:resume.fileName});
      }
    }
    state.applications=state.applications.filter(application=>application[0]!==state.volunteerStudentName);
    state.applications=[...entries,...state.applications];
    state.applied=entries.map(entry=>entry[9]);
    state.applicationFilter='待处理';
    state.volunteerSubmitted=true;
    state.volunteerMode=mode;
    state.volunteerSubmittedAt=time.full;
    state.volunteerSubmission={
      mode,
      modeLabel:mode==='self'?'自己投递':'学院安排',
      submittedAt:time.full,
      entries:submissionEntries,
      selfUnit:mode==='self'?'':null,
      adjust:mode==='self'?'':state.volunteerDraft.adjust,
      reason:mode==='self'?'':state.volunteerDraft.reason,
      payload:volunteerSubmissionContract(mode,submissionEntries,time)
    };
    state.volunteerJobDetail=null;
    persistVolunteerState();
    toast(mode==='self'?'自己投递已提交':'志愿已提交');
    render();
  }

  const IX_TODAY='2026-10-29';
  const IX_WEEKS=16;
  const IX_DOW=['日','一','二','三','四','五','六'];
  const IX_MOODS=['😮‍💨','🥱','😐','🙂','😄','🤩','🥳','😤','😢','😌'];
  const IX_MOOD_NAMES=['疲惫','犯困','平静','不错','开心','超棒','兴奋','有压力','低落','满足'];
  const IX_TYPES=['推文','视频','摄影','设计','文档'];

  function ixDate(value){const m=String(value).slice(0,10).match(/(\d{4})-(\d{2})-(\d{2})/);return m?new Date(Number(m[1]),Number(m[2])-1,Number(m[3])):null}
  function ixISO(date){const pad=n=>String(n).padStart(2,'0');return `${date.getFullYear()}-${pad(date.getMonth()+1)}-${pad(date.getDate())}`}
  function ixAddDays(value,days){const d=ixDate(value);if(!d)return'';d.setDate(d.getDate()+days);return ixISO(d)}
  function ixDayDiff(from,to){const a=ixDate(from),b=ixDate(to);if(!a||!b)return null;return Math.round((b-a)/86400000)}
  function ixWeekAnchor(value){const d=ixDate(value);if(!d)return'';const shift=d.getDay();return ixISO(new Date(d.getFullYear(),d.getMonth(),d.getDate()-shift))}
  function ixWeekStart(index){return ixAddDays(ixWeekAnchor(state.internshipStartDate),(index-1)*7)}
  function ixWeekEnd(index){return ixAddDays(ixWeekStart(index),6)}
  function ixPeriodEnd(){return ixAddDays(ixWeekAnchor(state.internshipStartDate),IX_WEEKS*7-1)}
  function ixWeekIndex(date){const diff=ixDayDiff(ixWeekStart(1),date);if(diff===null||diff<0||diff>=IX_WEEKS*7)return null;return Math.floor(diff/7)+1}
  function ixCurrentWeek(){const index=ixWeekIndex(IX_TODAY);if(index)return index;return IX_TODAY<state.internshipStartDate?1:IX_WEEKS}
  function ixWeekNum(label){const m=String(label||'').match(/(\d+)/);return m?Number(m[1]):null}
  function ixWeekReport(index){return state.studentHistory.find(item=>ixWeekNum(item.week)===index)||null}
  function ixReportFile(index){const report=ixWeekReport(index);return report&&report.file?report.file:null}
  function ixDayLog(date){return state.internshipDayLogs&&state.internshipDayLogs[date]?state.internshipDayLogs[date]:null}
  const IX_LOAD_COLORS=['#6d94c4','#5aa0a6','#c2a04a','#c47a3f','#bf5148'];
  const IX_LOAD_COLORS_DARK=['#89aede','#6fbfc4','#dcc06a','#d99a5e','#d9746b'];
  function ixLoadColor(level){
    const value=Math.round(level||0);
    if(value<=0)return document.documentElement.dataset.theme==='dark'?'#2a3543':'#c9d5e3';
    const list=document.documentElement.dataset.theme==='dark'?IX_LOAD_COLORS_DARK:IX_LOAD_COLORS;
    return list[Math.min(5,Math.max(1,value))-1];
  }
  function ixHours(log){
    if(!log||!log.start||!log.end)return null;
    const [sh,sm]=log.start.split(':').map(Number),[eh,em]=log.end.split(':').map(Number);
    let minutes=eh*60+em-(sh*60+sm);
    if(minutes<0)minutes+=1440;
    return minutes/60;
  }
  function ixHoursLabel(log){const hours=ixHours(log);if(hours===null)return'';return `${Math.round(hours*10)/10}h`.replace('.0h','h')}
  function ixRangeLabel(start,end){return `${formatDate(start)} – ${formatDate(end)}`}

  function ixDemoDayLogs(){
    const logs={};
    const start=state.internshipStartDate;
    const end=ixPeriodEnd();
    for(let offset=0;offset<IX_WEEKS*7;offset+=1){
      const date=ixAddDays(start,offset);
      if(!date||date>=IX_TODAY||date>end)break;
      const weekday=ixDate(date).getDay();
      if(weekday===0||weekday===6)continue;
      const seed=(offset*31+offset*offset*7)%97;
      if(seed%13===5)continue;
      const startTime=['09:00','09:10','08:50','09:20','09:35','09:05'][seed%6];
      const endTime=['18:00','18:20','18:45','19:10','17:50','20:05','18:35'][seed%7];
      logs[date]={start:startTime,end:endTime,workload:2+(seed%4),mood:IX_MOODS[seed%IX_MOODS.length]};
    }
    return logs;
  }

  const IX_CLOCK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="12" cy="12" r="8"/><path d="M12 7.5V12l3 2"/></svg>';
  function ixSlogan(){
    const week=ixCurrentWeek();
    const start=state.internshipStartDate;
    const end=ixPeriodEnd();
    const todayLog=ixDayLog(IX_TODAY);
    const weekday=ixDate(IX_TODAY).getDay();
    const todayInPeriod=IX_TODAY>=start&&IX_TODAY<=end;
    const lines=[
      ['先坐下来，事情就已经开始了一半','第一天的样子，往往最真实'],
      ['节奏在慢慢成形，不用急着交出完美','手熟了，判断也会跟着长出来'],
      ['你已经能看见自己的变化了','稳住节奏，比追进度更重要'],
      ['过半之后，把喜欢的事做深一点','越往后，越知道自己要什么'],
      ['收尾阶段，把这段日子攒成故事','快要收尾了，把好的留下'],
      ['最后一程，好好告别','最后一程，也值得认真记录']
    ];
    const stage=week<=2?0:week<=5?1:week<=9?2:week<=12?3:week<=15?4:5;
    if(todayInPeriod&&weekday>=1&&weekday<=5&&!todayLog)return ['今天也值得被记下来','今天的小事，以后会有用','今天也留一笔吧'][week%3];
    return lines[stage][todayLog?1:0];
  }
  function ixDayCellMarkup(date){
    const i=ixDate(date).getDay();
    const log=ixDayLog(date);
    const selected=state.ixDayDraft?state.ixDayDraft.date===date:false;
    const weekend=i===0||i===6;
    const classes=['ix-day',log?'is-logged':'',date===IX_TODAY?'is-today':'',selected?'is-sel':'',date>IX_TODAY?'is-future':'is-past',weekend?'is-weekend':''].filter(Boolean).join(' ');
    const title=`${date.slice(5).replace('-','/')} 周${IX_DOW[i]}${log?` ${log.start}–${log.end}`:''}`;
    const moodIndex=log?IX_MOODS.indexOf(log.mood):-1;
    const moodName=moodIndex>=0?IX_MOOD_NAMES[moodIndex]:'';
    return `<button type="button" class="${classes}" data-date="${date}" aria-label="${title}" aria-pressed="${selected}" onclick="ixOpenDay('${date}')">
      <span class="ix-day-top">
        <b>${Number(date.slice(8,10))===1?`<span class="mo">${Number(date.slice(5,7))}/</span>`:''}${Number(date.slice(8,10))}</b>
        ${log?`<span class="ix-day-mood" title="${moodName}">${log.mood}</span>`:''}
      </span>
      ${log?`<span class="t">${log.start} <i>–</i> ${log.end}</span>
      <span class="ix-day-bottom"><span class="ix-load"><i style="width:${Math.min(100,(log.workload||0)*20)}%;background:${ixLoadColor(log.workload)}"></i></span><span class="h">${ixHoursLabel(log)}</span></span>`:''}
    </button>`;
  }
  function renderIxCalendar(){
    const current=ixCurrentWeek();
    const selected=state.ixDayDraft?state.ixDayDraft.date:'';
    const start=state.internshipStartDate;
    const end=ixPeriodEnd();
    const gridStart=ixWeekAnchor(start);
    const rows=[];
    let lastMonth='';
    for(let week=1;week<=IX_WEEKS;week+=1){
      const monthAnchor=ixAddDays(gridStart,(week-1)*7+3);
      const monthKey=monthAnchor.slice(0,7);
      if(monthKey!==lastMonth){
        const first=lastMonth==='';
        const folded=!!state.ixMonthCollapsed[monthKey];
        const label=Number(monthKey.slice(5,7));
        rows.push(`<button type="button" class="ix-monthrow${first?' is-first':''}" data-month="${monthKey}" aria-expanded="${!folded}" title="${folded?'展开':'收起'} ${label} 月" onclick="ixToggleMonth('${monthKey}')"><span>${label} 月</span><em class="chev"></em><i></i></button>`);
        lastMonth=monthKey;
      }
      const foldedWeek=!!state.ixMonthCollapsed[monthKey];
      const days=[];
      for(let i=0;i<7;i+=1){
        const date=ixAddDays(gridStart,(week-1)*7+i);
        const inRange=date>=start&&date<=end;
        if(!inRange){
          days.push(`<span class="ix-day is-out" aria-hidden="true"><b>${Number(date.slice(8,10))}</b></span>`);
          continue;
        }
        days.push(ixDayCellMarkup(date));
      }
      rows.push(`<div class="ix-weekrow${foldedWeek?' is-folded':''}" data-month="${monthKey}"><span class="ix-wk ${week===current?'is-now':''}"><span class="pre">第 </span>${week}<span class="post"> 周</span></span><div class="ix-days">${days.join('')}</div></div>`);
    }
    return `<div class="ix-slogan"><span class="ix-slogan-deco"></span><span class="ix-slogan-text">${ixSlogan()}</span><span class="ix-slogan-deco r"></span></div>
    <div class="ix-cal">
      <div class="ix-dowrow"><span class="ix-wk"></span><div class="ix-days">${IX_DOW.map((day,index)=>`<span class="ix-dow ${index===0||index===6?'is-weekend':''}">${day}</span>`).join('')}</div></div>
      ${rows.join('')}
    </div>`;
  }

    if(bar){
      bar.style.setProperty('--pct',Math.min(100,workload*20)+'%');
      bar.style.setProperty('--c',ixLoadColor(workload));
      bar.setAttribute('data-load',String(workload));

  function ixPlacePopover(){
    const pop=document.getElementById('ixDayPop');
    if(!pop||!state.ixDayDraft)return;
    if(window.matchMedia('(max-width:760px)').matches){pop.classList.add('is-ready');return}
    const cell=document.querySelector(`.ix-day[data-date="${state.ixDayDraft.date}"]`);
    if(!cell){pop.classList.add('is-ready');return}
    const anchor=cell.getBoundingClientRect();
    const size=pop.getBoundingClientRect();
    const gap=10;
    let left=anchor.left+anchor.width/2-size.width/2;
    left=Math.max(12,Math.min(left,window.innerWidth-size.width-12));
    let top=anchor.bottom+gap;
    if(top+size.height>window.innerHeight-12){
      top=anchor.top-gap-size.height;
      if(top<12)top=Math.max(12,window.innerHeight-size.height-12);
    }
    pop.style.left=left+'px';
    pop.style.top=top+'px';
    pop.classList.add('is-ready');
  }
  function renderIxDayPopover(){
    const draft=state.ixDayDraft;

    const date=draft.date;
