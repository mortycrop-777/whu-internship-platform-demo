<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>专业实习智能平台 · 可运行原型 v0.2</title>
<style>
  :root{
    --ink:#14161a; --sub:#6f757f; --mute:#8f959e; --line:#ebedf0;
    --side:#f7f8fa; --bg:#fbfcfe; --card:#fff;
    --blue:#3b73f5; --blue2:#5b8ff5; --soft:#eef4ff; --warm:#f2b544; --green:#2f9e6b;
    --radius:14px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{color:var(--ink);background:var(--bg);font-family:Inter,"SF Pro Display","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased}
  button,input,select,textarea{font-family:inherit}
  a{color:inherit}
  .app{display:flex;height:100vh;overflow:hidden}
  .side{width:256px;flex:none;background:var(--side);border-right:1px solid var(--line);padding:18px 14px 14px;display:flex;flex-direction:column}
  .brandline{display:flex;align-items:center;gap:9px;padding:4px 8px 16px}
  .brandmark{width:24px;height:24px;flex:none;border-radius:50%;object-fit:cover;background:#fff;padding:1px;box-shadow:0 0 0 1px rgba(15,23,42,.06)}
  .login-brand .brandmark{width:32px;height:32px}
  .brandname{font-size:13px;font-weight:700}
  .ver{margin-left:auto;font-size:9px;color:#a9b0bc;background:#fff;border:1px solid #eaedf4;border-radius:6px;padding:2px 5px}
  .primary-btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:40px;border:0;border-radius:12px;
    background:linear-gradient(135deg,var(--blue2),var(--blue));color:#fff;font-size:13.5px;font-weight:600;cursor:pointer;
    box-shadow:0 6px 16px rgba(59,115,245,.24)}
  .primary-btn svg{width:15px;height:15px}
  nav{margin-top:12px;display:flex;flex-direction:column;gap:1px}
  .nav-item{display:flex;align-items:center;gap:11px;padding:11px 12px;border-radius:10px;font-size:13.5px;color:#373c43;cursor:pointer;position:relative}
  .nav-item:hover{background:#eef0f4}
  .nav-item.active{background:linear-gradient(90deg,#dce8ff 0%,#edf3ff 100%);color:#1a202c;font-weight:600}
  .nav-item.active:before{content:"";position:absolute;left:-14px;top:9px;bottom:9px;width:3.5px;border-radius:0 4px 4px 0;background:var(--blue)}
  .nav-item svg{width:17px;height:17px;color:#6d7685;flex:none}
  .nav-item.active svg{color:#2b5cd9}
  .nav-item .badge{margin-left:auto;font-size:10px;color:#8f959e;background:#eceef3;border-radius:5px;padding:1px 5px}
  .divider{height:1px;background:#e9ebef;margin:16px 10px}
  .side-label{font-size:11px;color:var(--mute);letter-spacing:.3px;margin:0 10px 8px}
  .side-card{margin:0 4px;background:#fff;border:1px solid #e8ebf2;border-radius:12px;padding:11px 12px}
  .side-card .big{font-size:13px;font-weight:600}
  .side-card .small{font-size:10.5px;color:#9aa1ad;margin-top:4px;line-height:1.5}
  .side-list{padding:0 10px}
  .side-list-row{display:flex;justify-content:space-between;gap:10px;padding:5px 0;font-size:11.5px;color:#6f757f}
  .side-list-row .t{color:#b0b6c0;font-size:10.5px;flex:none}
  .side-bottom{margin-top:auto}
  .side-foot{display:flex;align-items:center;gap:10px;padding:12px 8px 2px;border-top:1px solid #e9ebef}
  .avatar{width:32px;height:32px;border-radius:50%;overflow:hidden;flex:none}
  .who .name{font-size:12.5px;font-weight:600}
  .who .sub{font-size:10.5px;color:#9aa1ad;margin-top:1px}
  .foot-icon{margin-left:auto;color:#9aa3b2}
  .foot-icon svg{width:15px;height:15px}
  .trend-list{padding:0 10px}
  .trend-row{display:flex;align-items:center;gap:7px;padding:4px 0;font-size:11.5px;color:#5f6b7a}
  .trend-row .rank{width:16px;height:16px;border-radius:4px;background:#f1f3f6;color:#8f959e;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none}
  .trend-row .rank.hot{background:#fde2b8;color:#b4690e}
  .trend-row .q{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .trend-row .n{font-size:9.5px;color:#aab1bd;flex:none}
  .announce{margin:0 4px 10px;background:#fff;border:1px solid #e8ebf2;border-radius:10px;padding:8px 10px;overflow:hidden}
  .announce-label{display:flex;align-items:center;gap:5px;font-size:10px;color:#8f959e;margin-bottom:5px}
  .announce-label i{width:5px;height:5px;border-radius:50%;background:var(--blue);display:inline-block}
  .announce-track{overflow:hidden;white-space:nowrap;font-size:10.5px;color:#4f5b6b}
  .announce-track span{display:inline-block;white-space:nowrap;animation:marquee 14s linear infinite}
  @keyframes marquee{0%,10%{transform:translateX(0)}100%{transform:translateX(-100%)}}
  main{flex:1;overflow-y:auto;padding:26px 34px 40px}
  .page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:18px}
  .crumb{font-size:11px;color:#9aa1ad;margin-bottom:6px}
  h1{font-size:28px;font-weight:800;letter-spacing:-.6px}
  .sub{font-size:12.5px;color:var(--mute);margin-top:6px}
  .actions{display:flex;gap:8px;flex-wrap:wrap}
  .btn{height:34px;padding:0 13px;border-radius:9px;border:1px solid #e4e8f0;background:#fff;font-size:12px;color:#5f6672;cursor:pointer}
  a.btn{display:inline-flex;align-items:center;gap:6px;text-decoration:none}
  a.btn svg{width:14px;height:14px}
  .btn:hover{background:#f7f8fb}
  .btn.primary{background:linear-gradient(135deg,var(--blue2),var(--blue));border-color:transparent;color:#fff;font-weight:600;box-shadow:0 5px 14px rgba(59,115,245,.22)}
  .btn.danger{color:#b3261e;border-color:#f0d3d0}
  .btn.small{height:28px;font-size:11px;padding:0 9px}
  .btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
  .kpi{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:15px 16px}
  .kpi .k{font-size:11.5px;color:var(--mute)}
  .kpi .n{font-size:26px;font-weight:800;letter-spacing:-.8px;margin-top:5px}
  .kpi .d{font-size:10.5px;color:#9aa1ad;margin-top:4px;display:flex;align-items:center;gap:5px}
  .up{color:var(--green);background:#eaf7f1;border-radius:5px;padding:1px 5px;font-weight:600}
  .warn{color:#b4690e;background:#fdf1df;border-radius:5px;padding:1px 5px;font-weight:600}
  .grid-2{display:grid;grid-template-columns:1.62fr 1fr;gap:12px;margin-top:12px}
  .report-toolbar{display:flex;align-items:center;gap:12px;margin-bottom:12px;padding:10px 14px}
  .report-toolbar-label{font-size:11.5px;color:var(--mute)}
  .report-toolbar-meta{margin-left:auto;font-size:11px;color:var(--mute)}
  .report-list-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}
  .report-search{display:flex;align-items:center;gap:8px}
  .report-search .field{width:240px}
  .student-ledger-toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px;margin-bottom:12px;border:1px solid #eef1f6;border-radius:12px;background:#fafbfd}
  .student-ledger-search{display:flex;align-items:center;gap:7px;margin-right:auto}
  .student-ledger-search .field{width:260px;background:#fff}
  .student-filter-panel{padding:12px;margin:0 0 12px;border:1px solid #e4ebf5;border-radius:12px;background:#f8faff}
  .student-filter-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
  .student-filter-foot{display:flex;align-items:center;gap:8px;margin-top:10px;padding-top:10px;border-top:1px solid #e8eef7}
  .student-filter-foot .foot-note{margin-right:auto}
  .filter-badge{display:inline-flex;align-items:center;justify-content:center;min-width:16px;height:16px;padding:0 4px;margin-left:4px;border-radius:99px;background:#e8f0ff;color:#2b5cd9;font-size:9px}
  .result-summary{display:flex;align-items:center;gap:10px;margin-bottom:8px;font-size:11px;color:#8f959e}
  .result-summary button{border:0;background:transparent;color:#2f6fed;font-size:11px;cursor:pointer;padding:0}
  .report-score{font-size:12px;color:#373c43;font-weight:600;white-space:nowrap}
  .report-score span{font-size:10px;color:#8f959e;font-weight:400;margin-left:2px}
  .resume-file-card .card-head svg{width:16px;height:16px;color:#2f6fed}
  .application-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .application-actions .view-action{min-width:78px}
  .application-actions .decision-group{display:flex;align-items:center;gap:8px;margin-left:16px;padding-left:16px;border-left:1px solid #e3e8f0}
  .btn.approve{background:#237a52;border-color:#237a52;color:#fff;font-weight:600}
  .btn.approve:hover{background:#1b6443;border-color:#1b6443}
  .btn.reject{background:#fff;border-color:#e6aaa4;color:#b3261e;font-weight:600}
  .btn.reject:hover{background:#fff4f2}
  .student-import-modal{width:760px!important}
  .student-import-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:14px}
  .student-import-head h3{font-size:17px;margin-bottom:5px}
  .student-import-actions{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
  .import-file-box{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:16px;border:1px dashed #cfdcf2;border-radius:12px;background:#fafcff}
  .import-file-box strong{display:block;font-size:13px;color:#373c43}
  .import-file-box span{display:block;font-size:11px;color:#8f959e;margin-top:4px}
  .import-preview{max-height:310px;overflow:auto;border:1px solid #edf1f7;border-radius:10px}
  .import-preview .table th{position:sticky;top:0;background:#fff;z-index:1}
  .import-valid{color:#1f7a52;background:#eaf7f1}
  .import-invalid{color:#b3261e;background:#fbeceb}
  .report-list-foot{font-size:10.5px;color:var(--mute);margin-top:10px;text-align:right}
  .dashboard-tabs{margin-bottom:12px}
  .progress-stack{display:flex;height:14px;border-radius:8px;overflow:hidden;background:#f0f3f8}
  .progress-stack span{display:block;height:100%}
  .legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:10px;font-size:11px;color:#6f757f}
  .legend i{width:8px;height:8px;border-radius:2px;display:inline-block;margin-right:5px}
  .deadline{background:#fffaf0;border:1px solid #f5e0b8;color:#8a5a12}
  .risk-row{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid #f2f4f7;font-size:12px;color:#373c43}
  .risk-row:last-child{border-bottom:0}
  .risk-row .dot{width:7px;height:7px;border-radius:50%;background:#f2b544;flex:none}
  .risk-row .tag{margin-left:auto;font-size:10px;color:#b4690e;background:#fdf1df;border-radius:5px;padding:2px 6px}
  .placement-grid{display:grid;grid-template-columns:1.12fr 1fr 1.12fr;gap:12px;margin-top:12px;align-items:start}
  .donut-wrap{display:flex;align-items:center;gap:18px}
  .donut{width:128px;height:128px;border-radius:50%;position:relative;flex:none}
  .donut-hole{position:absolute;inset:25px;background:var(--card);border-radius:50%}
  .donut-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
  .donut-center b{font-size:22px;letter-spacing:-.5px}
  .donut-center span{font-size:9.5px;color:var(--mute)}
  .donut-legend{display:flex;flex-direction:column;gap:7px;font-size:10.5px;color:#5f6b7a;flex:1}
  .donut-legend .row{display:flex;align-items:center;gap:6px}
  .donut-legend i{width:8px;height:8px;border-radius:2px;display:inline-block;flex:none}
  .donut-legend .n{margin-left:auto;color:#9aa1ad}
  .timeline{display:flex;position:relative;margin-top:18px}
  .timeline:before{content:"";position:absolute;left:10%;right:10%;top:27px;height:2px;background:#e8edf5}
  .timeline-item{position:relative;z-index:1;flex:1;text-align:center}
  .timeline-month{font-size:10.5px;color:var(--mute);margin-bottom:5px}
  .timeline-dot{width:10px;height:10px;border-radius:50%;background:var(--blue);margin:0 auto;border:2px solid var(--card);box-shadow:0 0 0 1px #c9d8f8}
  .timeline-label{font-size:11px;color:#373c43;margin-top:5px;font-weight:500}
  .timeline-edit{display:flex;flex-direction:column;gap:7px;margin-top:12px}
  .timeline-edit-row{display:grid;grid-template-columns:132px 1fr;gap:8px}
  .method{display:inline-block;font-size:10px;border-radius:5px;padding:2px 6px;font-weight:500}
  .method.college{background:#e8f0ff;color:#2b5cd9}
  .method.self{background:#fdf1df;color:#b4690e}
  .challenge-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:12px}
  .report-layout{display:grid;grid-template-columns:1.5fr 1fr;gap:12px;align-items:start}
  .report-full{min-height:560px}
  .report-body{font-size:13px;line-height:1.9;color:#373c43}
  .report-section{margin-bottom:16px}
  .report-section h4{font-size:12px;font-weight:700;margin-bottom:5px;color:#1f2329}
  .report-section p{color:#373c43}
  .report-foot{margin-top:18px;border-top:1px solid #eef1f6;padding-top:10px;font-size:10.5px;color:#9aa1ad}
  .ai-badge{font-size:10px;color:#2b5cd9;background:#e8f0ff;border-radius:99px;padding:3px 8px;font-weight:600}
  .summary-text{font-size:13px;line-height:1.9;color:#2c3138;background:#f8faff;border:1px solid #e2ebff;border-radius:10px;padding:12px}
  .summary-skeleton{padding:6px 0 2px}
  .sk-line{height:11px;border-radius:6px;margin:8px 0;background:linear-gradient(90deg,#eef2f8 25%,#f8fafd 37%,#eef2f8 63%);background-size:400% 100%;animation:shimmer 1.4s ease infinite}
  .sk-line:nth-child(2){width:94%}.sk-line:nth-child(3){width:86%}.sk-line:nth-child(4){width:62%}
  .sk-note{font-size:11px;color:#9aa1ad;margin-top:10px}
  @keyframes shimmer{0%{background-position:100% 0}100%{background-position:0 0}}
  .summary-error{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#fbeceb;border:1px solid #f0d3d0;border-radius:10px;padding:12px;font-size:12px;color:#b3261e}
  .col{display:flex;flex-direction:column;gap:12px}
  .card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:15px 16px}
  .card-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
  .card-title{font-size:13px;font-weight:700}
  .card-sub{font-size:10.5px;color:#9aa1ad;margin-top:2px}
  .mini-tabs{display:flex;background:#f2f4f8;border-radius:8px;padding:2px}
  .mini-tabs span{font-size:10.5px;color:#8f959e;padding:3px 8px;border-radius:6px;cursor:pointer}
  .mini-tabs span.on{background:#fff;color:#373c43;box-shadow:0 1px 3px rgba(15,23,42,.08)}
  .q-row{display:flex;align-items:center;gap:10px;padding:7px 0}
  .q-row .text{flex:1;font-size:12px;color:#373c43;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .q-row .num{width:30px;text-align:right;font-size:11.5px;color:var(--mute);flex:none}
  .track{display:inline-block;width:96px;height:5px;border-radius:5px;background:#f0f3f8;flex:none;overflow:hidden;vertical-align:middle}
  .fill{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,#8db3ff,#3b73f5)}
  .gap-row{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid #f2f4f7}
  .gap-row:last-child{border-bottom:0}
  .gap-row .text{flex:1;font-size:12px;color:#373c43;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .gap-row .count{font-size:10.5px;color:#b4690e;background:#fdf1df;border-radius:5px;padding:2px 6px;font-weight:600}
  .gap-row .tag{font-size:10px;color:var(--mute);background:#f4f6fa;border-radius:5px;padding:2px 5px}
  .sug{display:flex;gap:9px;padding:8px 0;font-size:11.5px;line-height:1.6;color:#4f5b6b}
  .sug .idx{width:17px;height:17px;border-radius:50%;background:#e8f0ff;color:#2b5cd9;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none;margin-top:1px}
  .chart-labels{display:flex;justify-content:space-between;font-size:9.5px;color:#aab1bd;margin-top:4px}
  .foot-note{font-size:10px;color:#aab1bd;margin-top:12px}
  .tagline{font-size:12px;color:#5b7bb5;letter-spacing:.2px;margin-bottom:10px}
  .spark{display:inline-block;width:28px;height:28px;margin-left:6px;vertical-align:5px;color:var(--warm)}
  .spark svg{display:block;width:100%;height:100%}
  .chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
  .chip{border:1px solid #e6eaf2;background:#fff;border-radius:10px;padding:7px 12px;font-size:12px;color:#4f5b6b;display:flex;align-items:center;gap:6px;cursor:pointer}
  .chip:hover{border-color:#cddcff;background:#f8faff}
  .chip svg{width:12px;height:12px}
  .chat-wrap{max-width:780px}
  .chat-main{display:flex;flex-direction:column;justify-content:center}
  .chat-hero{width:100%;max-width:920px;margin:0 auto}
  .chat-hero h1{font-size:44px;line-height:1.14;letter-spacing:-1.6px}
  .chat-hero h1 .l2{display:block}
  .seg{display:inline-flex;background:#f1f3f8;border-radius:14px;padding:4px;margin-top:22px}
  .seg-item{padding:8px 15px;border-radius:10px;font-size:12.5px;color:#6b7280;cursor:pointer}
  .seg-item.active{background:#1b1b1b;color:#fff;font-weight:600}
  .input-card{margin-top:16px;background:#fff;border:1px solid #e6ecf7;border-radius:18px;
    box-shadow:0 0 0 4px rgba(59,115,245,.05),0 16px 38px rgba(59,115,245,.09);padding:18px 20px 13px}
  .chat-input{width:100%;border:0;outline:0;font-size:14.5px;color:#454a52;background:transparent;line-height:1.6;min-height:48px;resize:none}
  .chat-input::placeholder{color:#98a1af}
  .input-bar{display:flex;align-items:center;justify-content:space-between;margin-top:6px}
  .bar-left,.bar-right{display:flex;align-items:center;gap:9px}
  .round-btn{width:28px;height:28px;border-radius:50%;border:1px solid #dfe6f2;background:#f8f9fb;color:#7b879b;display:flex;align-items:center;justify-content:center;cursor:pointer}
  .pill-btn{display:flex;align-items:center;gap:6px;border:1px solid #e6eaf2;background:#f8fafd;border-radius:9px;padding:6px 9px;font-size:11.5px;color:#5f6b7a;cursor:pointer}
  .pill-btn svg{width:12px;height:12px}
  .model-pill{display:flex;align-items:center;gap:6px;background:#f4f6fa;border:1px solid #e5e9f2;border-radius:20px;padding:5px 9px;font-size:11.5px;color:#2b2f36;cursor:pointer}
  .check{display:flex;align-items:center;gap:6px;font-size:12px;color:#5f6b7a}
  .check input{accent-color:var(--blue)}
  .check svg{width:9px;height:9px}
  .send{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--blue2),var(--blue));border:0;color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 6px 16px rgba(59,115,245,.28)}
  .send svg{width:15px;height:15px}
  .hint-row{display:flex;align-items:center;justify-content:space-between;margin-top:12px;gap:12px}
  .hint{display:flex;gap:14px;color:#9aa3b2;font-size:11.5px;flex-wrap:wrap}
  .hint span{display:flex;align-items:center;gap:5px}
  .hint svg{width:10px;height:10px;color:#92a6cc}
  .history-btn{display:flex;align-items:center;gap:6px;border:1px solid #dbe7ff;background:var(--soft);border-radius:9px;padding:7px 11px;font-size:11.5px;color:#2f6fed;cursor:pointer}
  .history-btn svg{width:13px;height:13px;color:var(--blue)}
  .history-wrap{position:relative}
  .popover{position:absolute;right:0;top:calc(100% + 9px);width:360px;background:#fff;border:1px solid #e6ecf7;border-radius:14px;box-shadow:0 16px 44px rgba(31,74,158,.13);padding:7px;z-index:20}
  .popover:before{content:"";position:absolute;right:24px;top:-6px;width:10px;height:10px;background:#fff;border-left:1px solid #e6ecf7;border-top:1px solid #e6ecf7;transform:rotate(45deg)}

  .rich-toolbar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;border:1px solid #e4e9f2;border-bottom:0;border-radius:9px 9px 0 0;background:#f8fafd;padding:6px}

  .table{width:100%;border-collapse:collapse;font-size:12px}

  .table tr:last-child td{border-bottom:0}
  .status{display:inline-flex;align-items:center;border-radius:5px;padding:2px 6px;font-size:10px;font-weight:600}
  .status.ok{color:#1f7a52;background:#eaf7f1}
  .status.pending{color:#b4690e;background:#fdf1df}
  .status.gray{color:#6f757f;background:#f1f3f6}
  .status.rejected{color:#b3261e;background:#fbeceb}
  .level{display:inline-flex;align-items:center;border-radius:5px;padding:2px 6px;font-size:10px;font-weight:600}
  .level.special{color:#b4690e;background:#fde2b8}
  .level.excellent{color:#2b5cd9;background:#e8f0ff}
  .level.pass{color:#5f6b7a;background:#f1f3f6}
  .tabs{display:flex;gap:4px;background:#f2f4f8;border-radius:10px;padding:3px;width:max-content}
  .tab{border:0;background:transparent;border-radius:8px;padding:6px 11px;font-size:11.5px;color:#6b7280;cursor:pointer}
  .tab.active{background:#fff;color:#1b1b1b;font-weight:600;box-shadow:0 1px 3px rgba(15,23,42,.08)}
  .progress{height:7px;border-radius:6px;background:#f0f3f8;overflow:hidden}

  .job-card{border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px}
  .challenge-job-card{cursor:pointer;transition:border-color .18s,box-shadow .18s,transform .18s}
  .challenge-job-card:hover{border-color:#b8c9e7;box-shadow:0 8px 22px rgba(37,64,105,.08);transform:translateY(-1px)}
  .challenge-job-card:focus-visible{outline:2px solid #7da4f5;outline-offset:2px}

  .job-card h3{font-size:14px}
  .job-meta{font-size:11px;color:#8f959e;line-height:1.6}
  .job-tags{display:flex;gap:5px;flex-wrap:wrap}
  .job-tag{font-size:10px;color:#5f6b7a;background:#f4f6fa;border-radius:5px;padding:2px 6px}
  .job-foot{display:flex;align-items:center;justify-content:space-between;margin-top:auto;padding-top:6px;border-top:1px solid #f2f4f7}
  .points{font-size:11px;color:#b4690e;font-weight:600}

  .toast{position:fixed;top:18px;left:50%;transform:translate(-50%,-10px);background:rgba(28,29,33,.92);color:#fff;font-size:12px;padding:8px 14px;border-radius:99px;box-shadow:0 8px 24px rgba(0,0,0,.16);opacity:0;pointer-events:none;transition:.2s;z-index:80}
  .toast.show{opacity:1;transform:translate(-50%,0)}
  .notice{background:#f8faff;border:1px solid #e2ebff;color:#4f6b9e;border-radius:10px;padding:10px 12px;font-size:11.5px;line-height:1.7}
  .empty{color:#aab1bd;font-size:12px;padding:18px 0;text-align:center}

  /* 登录页 */
  .login-page{display:flex;height:100vh;background:radial-gradient(1000px 620px at 18% -10%,#eaf2ff 0%,rgba(234,242,255,0) 62%),radial-gradient(900px 600px at 88% 108%,#f0f5ff 0%,rgba(240,245,255,0) 60%),#fbfcfe}

  .login-card{width:400px;background:#fff;border:1px solid #e6ecf7;border-radius:24px;box-shadow:0 0 0 4px rgba(59,115,245,.04),0 24px 70px rgba(59,115,245,.10);padding:32px}
  .login-card h2{font-size:24px;font-weight:800;letter-spacing:-.5px}
  .login-card .lead{font-size:13px;color:var(--mute);margin-top:7px}
  .roles{display:flex;background:#f1f3f8;border-radius:14px;padding:4px;margin:20px 0}

  .split:before,.split:after{content:"";flex:1;height:1px;background:#eef1f6}

  .login-note{text-align:center;font-size:11px;color:#aab2bf;margin-top:12px}
  .hidden{display:none!important}
  .side-foot{position:relative}
  .foot-icon{margin-left:auto;color:#9aa3b2;border:0;background:transparent;padding:4px;border-radius:6px;cursor:pointer;display:flex;align-items:center;justify-content:center}

  .set-item em{margin-left:auto;font-style:normal;font-size:10px;color:#9aa1ad}
  .set-item.danger{color:#b3261e}
  .set-item.danger .set-ico{color:#b3261e}

    const f=e.target.files[0];e.target.value='';
    if(!f)return;
    if(!/\.(pdf|doc|docx)$/i.test(f.name)){toast('简历仅支持 PDF / DOC / DOCX');return}
    if(f.size>10*1024*1024){toast('简历不能超过 10MB');return}
    state.resumeFile={name:f.name,size:f.size,type:f.type};
    toast('简历已添加');
    render();
  }
  function handlePortfolio(e){
    const files=[...e.target.files];e.target.value='';
    const allowed=/\.(pdf|zip|jpg|jpeg|png)$/i;

  function parseCsvLine(line){
    const cells=[];let value='';let quoted=false;
    for(let i=0;i<line.length;i++){
      const ch=line[i];
      if(ch==='"'){
        if(quoted&&line[i+1]==='"'){value+='"';i++}else quoted=!quoted;
      }else if(ch===','&&!quoted){cells.push(value.trim());value=''}else value+=ch;
    }
    cells.push(value.trim());
    return cells;
  }
  function maskIdNumber(id){return id.length>8?`${id.slice(0,4)}${'*'.repeat(id.length-8)}${id.slice(-4)}`:'****'}
  function parseStudentImportCsv(text){
    const lines=String(text).replace(/^\uFEFF/,'').split(/\r?\n/).filter(line=>line.trim());
    if(lines.length<2)return {rows:[],error:'文件为空，或只有表头没有学生数据'};
    const headers=parseCsvLine(lines[0]).map(h=>h.replace(/\s+/g,'').toLowerCase());
    const noIndex=headers.findIndex(h=>['学号','student_id','studentno'].includes(h));
    const nameIndex=headers.findIndex(h=>['姓名','name'].includes(h));
    const idIndex=headers.findIndex(h=>['身份证号','id_number','idnumber'].includes(h));
    if([noIndex,nameIndex,idIndex].some(i=>i<0))return {rows:[],error:'表头缺少必填列：学号、姓名、身份证号'};
    const seenNos=new Set();
    const seenIds=new Set();
    const rows=lines.slice(1).map((line,i)=>{
      const cells=parseCsvLine(line);
      const studentNo=(cells[noIndex]||'').trim();
      const name=(cells[nameIndex]||'').trim();
      const idNumber=(cells[idIndex]||'').trim().toUpperCase();
      const errors=[];
      if(!/^[A-Za-z0-9-]{4,30}$/.test(studentNo))errors.push('学号格式不正确');
      if(name.length<2||name.length>20)errors.push('姓名长度应为 2–20 字');
      if(!/^\d{17}[\dX]$/.test(idNumber))errors.push('身份证号应为 18 位');
      if(seenNos.has(studentNo))errors.push('学号重复');else if(studentNo)seenNos.add(studentNo);
      if(seenIds.has(idNumber))errors.push('身份证号重复');else if(idNumber)seenIds.add(idNumber);
      return {line:i+2,studentNo,name,idMasked:maskIdNumber(idNumber),valid:errors.length===0,message:errors.join('；')||'可自动创建账号'};
    });
    return {rows,error:''};
  }

    if(file.size>5*1024*1024){state.studentImportError='名单文件不能超过 5MB';state.studentImportRows=[];render();return}
    file.text().then(text=>{
      const parsed=parseStudentImportCsv(text);
      state.studentImportFileName=file.name;
      state.studentImportRows=parsed.rows;
      state.studentImportError=parsed.error;
      render();

  function selectReport(i){state.selectedReport=i;render()}
  function startSummary(i){
    if(state.summaryGenerated[i]||state.summaryStarted[i])return;
    state.summaryStarted[i]=true;
    state.summaryLoadingIndex=i;
    render();
    setTimeout(()=>{
      state.summaryGenerated[i]=true;
      state.summaryFailed[i]=false;
      if(state.summaryLoadingIndex===i)state.summaryLoadingIndex=null;
      render();
      toast('AI 摘要已生成');
    },1200);
  }
  function retrySummary(){
    const i=state.selectedReport;
    state.summaryGenerated[i]=false;
    state.summaryStarted[i]=false;
    state.summaryFailed[i]=false;
    state.summaryLoadingIndex=null;
    render();
    setTimeout(()=>startSummary(i),50);
    toast('正在重新生成摘要…');
  }
  function scoreReport(e){
    e.preventDefault();
    const f=new FormData(e.target);
    const level=f.get('level')||'合格';
    let score=6;
    const tags=[];
    if(level==='特别优秀')score+=2;
    if(level==='优秀')score+=1;
    if(f.get('innovation')){score+=0.25;tags.push('创新报告')}
    if(f.get('excerpted')){score+=0.15;tags.push('被摘录报告')}
    if(f.get('late')){score-=1;tags.push('延交')}
    score=Math.round(score*100)/100;
    const r=state.reports[state.selectedReport];
    r.status='已评价';
    r.level=level;
    r.score=score;
    r.tags=tags;
    r.comment=f.get('comment')||'';
    if(r.student===state.studentProfile.name){
      let studentReport=state.studentHistory.find(x=>x.week===r.week);
      if(!studentReport){
        studentReport={week:r.week};
        state.studentHistory.unshift(studentReport);
      }
      Object.assign(studentReport,{status:'已评价',level,score,tags:[...tags],comment:r.comment});
    }
    state.lastScoredReport=state.selectedReport;
    toast('评价已提交，本次得分 '+score);
    render();
  }

    const list=DATA.interns.filter(x=>x[2]===(state.scoringTab==='pending'?'待评分':'已评分'));
    const pendingCount=DATA.interns.filter(x=>x[2]==='待评分').length;
    const doneCount=DATA.interns.filter(x=>x[2]==='已评分').length;
    return shell('enterprise','enterprise/scoring',`${head('实习评分',{crumb:'企业端 / 实习评分',text:'mentor 直接评分，替代学生自填评语'},`<button class="btn" onclick="showToast('评分标准已下载')">评分标准</button>`)}
      <div class="tabs" style="margin-bottom:12px"><button class="tab ${state.scoringTab==='pending'?'active':''}" onclick="state.scoringTab='pending';render()">待评分 (${pendingCount})</button><button class="tab ${state.scoringTab==='done'?'active':''}" onclick="state.scoringTab='done';render()">已评分 (${doneCount})</button></div>
      <div class="card"><table class="table"><thead><tr><th>实习生</th><th>实习单位</th><th>状态</th><th>操作</th></tr></thead><tbody>${list.map((x,i)=>`<tr><td>${x[0]}</td><td>${x[1]}</td><td><span class="status ${x[2]==='已评分'?'ok':'pending'}">${x[2]}</span></td><td>${x[2]==='待评分'?`<button class="btn small primary" onclick="openScore('${x[0]}')">评分</button>`:`<button class="btn small" onclick="showToast('已打开 ${x[0]} 的评分详情')">查看</button>`}</td></tr>`).join('')}</tbody></table></div>
      ${state.scoringTarget?`<div class="modal-bg"><div class="modal"><div class="modal-head"><h3>${state.scoringTarget} · 实习评分</h3><button class="modal-close" onclick="state.scoringTarget=null;render()">×</button></div><form onsubmit="submitScore(event)"><div class="form-grid"><div><label class="field-label">专业能力</label><select class="select" name="s1">${[5,4,3,2,1].map(n=>`<option>${n}</option>`).join('')}</select></div><div><label class="field-label">工作态度</label><select class="select" name="s2">${[5,4,3,2,1].map(n=>`<option>${n}</option>`).join('')}</select></div><div><label class="field-label">协作沟通</label><select class="select" name="s3">${[5,4,3,2,1].map(n=>`<option>${n}</option>`).join('')}</select></div><div><label class="field-label">成长潜力</label><select class="select" name="s4">${[5,4,3,2,1].map(n=>`<option>${n}</option>`).join('')}</select></div><div class="full"><label class="field-label">评语</label><textarea class="textarea" name="comment" placeholder="写下对该实习生的评价"></textarea></div></div><div class="form-actions"><button type="button" class="btn" onclick="state.scoringTarget=null;render()">取消</button><button class="btn primary" type="submit">提交评分</button></div></form></div></div>`:''}`)
  }
  function openScore(name){state.scoringTarget=name;render()}
  function submitScore(e){e.preventDefault();const x=DATA.interns.find(i=>i[0]===state.scoringTarget);if(x)x[2]='已评分';state.scoringTarget=null;toast('评分已提交');render()}

  function renderEnterpriseApplications(){
    const filter=state.applicationFilter;
    const filters=['待处理','已通过','已拒绝','全部'];
    const countFor=status=>status==='全部'?state.applications.length:state.applications.filter(a=>a[3]===status).length;
    const rows=state.applications.map((application,index)=>({application,index})).filter(({application})=>filter==='全部'||application[3]===filter);
    return shell('enterprise','enterprise/applications',`${head('揭榜管理',{crumb:'企业端 / 揭榜管理',text:'处理学生揭榜申请，确认面试与录用'},`<button class="btn" onclick="showToast('已导出揭榜名单')">导出名单</button>`)}
      <div class="card">
        <div class="card-head"><div><div class="card-title">学生揭榜申请</div><div class="card-sub">当前显示 ${rows.length} 份 · 共 ${state.applications.length} 份</div></div></div>
        <div class="tabs" style="margin-bottom:12px">${filters.map(status=>`<button class="tab ${filter===status?'active':''}" onclick="state.applicationFilter='${status}';render()">${status} (${countFor(status)})</button>`).join('')}</div>
        <table class="table"><thead><tr><th>学生</th><th>岗位</th><th>揭榜时间</th><th>状态</th><th>操作</th></tr></thead><tbody>${rows.length?rows.map(({application:a,index:i})=>`<tr><td>${a[0]}</td><td>${a[1]}</td><td>${a[2]}</td><td><span class="status ${a[3]==='已通过'?'ok':a[3]==='已拒绝'?'rejected':'pending'}">${a[3]}</span></td><td><div class="application-actions"><button class="btn small view-action" onclick="openApplicationDetail(${i})">查看资料</button>${a[3]==='待处理'?`<div class="decision-group"><button class="btn small approve" onclick="reviewApp(${i},true)">✓ 通过申请</button><button class="btn small reject" onclick="reviewApp(${i},false)">× 拒绝申请</button></div>`:''}</div></td></tr>`).join(''):`<tr><td colspan="5" class="empty">当前没有${filter==='全部'?'':esc(filter)}的揭榜申请</td></tr>`}</tbody></table>
      </div>${state.applicationDetail!==null?renderApplicationDetailModal():''}`)
  }
  function reviewApp(i,ok){state.applications[i][3]=ok?'已通过':'已拒绝';toast(ok?'已通过该揭榜申请':'已拒绝该揭榜申请');render()}
  function openApplicationDetail(i){state.applicationDetail=i;render()}
  function renderApplicationDetailModal(){
    const i=state.applicationDetail;
    const application=state.applications[i];
    if(!application)return '';
    const row=DATA.students.find(s=>s[0]===application[0]);
    const p=profileForStudent(row);
    const profiles={
      '李明':{phone:'138 0000 1234',email:'liming@whu.edu.cn',direction:'融媒体采编 / 短视频',intro:'具有公众号排版、现场采访和短视频剪辑经验，希望进入融媒体一线完成采编全流程实践。',skills:['公众号排版','PR 剪辑','现场采访'],resume:'李明-融媒体采编简历.pdf',resumeSize:'286 KB',resumeUrl:'assets/resumes/李明-融媒体采编简历.pdf',portfolio:'江滩文旅短视频作品集.pdf'},
      '张琪':{phone:'139 0000 5678',email:'zhangqi@whu.edu.cn',direction:'短视频运营 / 内容策划',intro:'熟悉短视频选题、脚本与平台运营，有校园账号内容策划经验。',skills:['短视频策划','数据分析','脚本写作'],resume:'张琪-短视频运营简历.pdf',resumeSize:'312 KB',resumeUrl:'assets/resumes/张琪-短视频运营简历.pdf',portfolio:'校园账号运营案例.pdf'},
      '王雨':{phone:'136 0000 2468',email:'wangyu@whu.edu.cn',direction:'内容运营 / 新闻采编',intro:'有校园媒体采写与内容运营经历，关注社会议题和深度报道。',skills:['新闻采写','内容运营','事实核查'],resume:'王雨-内容运营简历.pdf',resumeSize:'274 KB',resumeUrl:'assets/resumes/王雨-内容运营简历.pdf',portfolio:'社区采访作品集.pdf'},
      '陈静':{phone:'137 0000 1357',email:'chenjing@whu.edu.cn',direction:'新媒体编辑 / 品牌传播',intro:'擅长内容编辑与视觉排版，参与过校园公众号专题策划。',skills:['新媒体编辑','视觉排版','专题策划'],resume:'陈静-新媒体编辑简历.pdf',resumeSize:'298 KB',resumeUrl:'assets/resumes/陈静-新媒体编辑简历.pdf',portfolio:'校园专题策划作品.pdf'},
      '周宁':{phone:'135 0000 8642',email:'zhouning@whu.edu.cn',direction:'短视频运营 / 用户增长',intro:'关注短视频平台内容生态，具备账号增长和社群运营经验。',skills:['账号运营','社群维护','剪辑基础'],resume:'周宁-短视频运营简历.pdf',resumeSize:'305 KB',resumeUrl:'assets/resumes/周宁-短视频运营简历.pdf',portfolio:'账号增长复盘.pdf'}
    };
    const detail=profiles[application[0]]||{phone:'联系方式未填写',email:'邮箱未填写',direction:'待补充',intro:'学生暂未补充个人简介。',skills:[],resume:'简历待上传',resumeSize:'—',resumeUrl:'',portfolio:'暂未上传作品集'};
    const phone=detail.phone;
    return `<div class="modal-bg"><div class="modal" style="width:680px"><div class="modal-head"><div><h3>学生揭榜资料 · ${esc(application[0])}</h3><div class="job-meta" style="margin-top:4px">${esc(application[1])} · 揭榜于 ${esc(application[2])}</div></div><button class="modal-close" onclick="state.applicationDetail=null;render()">×</button></div>
      <div class="profile-grid" style="margin-bottom:12px"><div class="profile-row"><b>姓名</b>${esc(p.name)}</div><div class="profile-row"><b>学号</b>${esc(p.studentNo||'—')}</div><div class="profile-row"><b>班级</b>${esc(row?.[1]||p.className)}</div><div class="profile-row"><b>当前状态</b><span class="status ${application[3]==='已通过'?'ok':application[3]==='已拒绝'?'rejected':'pending'}">${application[3]}</span></div><div class="profile-row"><b>联系电话</b>${esc(phone)}</div><div class="profile-row"><b>联系邮箱</b>${esc(detail.email)}</div></div>
      <div style="display:grid;grid-template-columns:1.25fr 1fr;gap:10px"><div class="card" style="padding:12px"><div class="card-title" style="margin-bottom:6px">求职方向</div><div class="job-meta" style="margin-bottom:8px">${esc(detail.direction)}</div><div class="answer-body" style="font-size:11.5px;line-height:1.75">${esc(detail.intro)}</div><div class="job-tags" style="margin-top:10px">${detail.skills.map(skill=>`<span class="job-tag">${esc(skill)}</span>`).join('')}</div></div>
      <div class="card resume-file-card" style="padding:12px"><div class="card-head" style="margin-bottom:6px"><div class="card-title">简历与作品</div>${ICONS.doc}</div><div class="profile-row"><b>简历</b>${esc(detail.resume)}</div><div class="profile-row"><b>文件大小</b>${esc(detail.resumeSize)}</div><div class="profile-row"><b>作品集</b>${esc(detail.portfolio)}</div><div style="display:flex;gap:8px;margin-top:9px;flex-wrap:wrap"><a class="btn small" href="${esc(detail.resumeUrl)}" target="_blank" rel="noopener">查看简历原件</a><a class="btn small" href="${esc(detail.resumeUrl)}" download="${esc(detail.resume)}">下载简历 PDF</a></div></div></div>
      ${application[3]==='待处理'?`<div class="form-actions"><button class="btn reject" onclick="reviewApp(${i},false)">× 拒绝申请</button><button class="btn approve" onclick="reviewApp(${i},true)">✓ 通过申请</button></div>`:`<div class="foot-note" style="margin-top:12px">${application[3]==='已通过'?'申请已通过，可联系学生安排后续流程。':'该申请已拒绝，如需重新评估可返回列表处理。'}</div>`}
    </div></div>`;
  }

  const ROUTES={
    'login':renderLogin,
    'student/chat':renderChat,
    'student/volunteer':renderVolunteer,
    'student/internship':renderInternship,
    'student/profile':renderStudentProfile,
    'student/challenges':renderChallenges,
    'teacher/dashboard':renderTeacherDashboard,
    'teacher/students':renderTeacherStudents,
    'teacher/challenges':renderTeacherChallenges,
    'teacher/reports':renderTeacherReportList,
    'enterprise/jobs':renderEnterpriseJobs,
    'enterprise/scoring':renderEnterpriseScoring,
    'enterprise/applications':renderEnterpriseApplications
  };

  function render(){
    const params=new URLSearchParams(location.search);
    if(params.get('theme')==='dark')state.theme='dark';
    if(params.get('settings')==='1')state.settingsOpen=true;
    if(params.get('tab')==='placement')state.dashboardTab='placement';
    if(params.get('tab')==='questions')state.dashboardTab='questions';
    if(params.get('timeline')==='edit')state.timelineEdit=true;
    if(params.get('import')==='open')state.studentImportOpen=true;
    if(params.get('import')==='sample'){
      const parsed=parseStudentImportCsv(STUDENT_IMPORT_SAMPLE_CSV);
      state.studentImportOpen=true;
      state.studentImportFileName='示例学生名单.csv';
      state.studentImportRows=parsed.rows;
      state.studentImportError=parsed.error;
    }
    if(params.get('import')==='imported'){
      const parsed=parseStudentImportCsv(STUDENT_IMPORT_SAMPLE_CSV);
      state.cohortStudents=parsed.rows.filter(r=>r.valid).map(r=>({studentNo:r.studentNo,name:r.name,idMasked:r.idMasked,accountStatus:'已创建'}));
      state.cohortSize=state.cohortStudents.length;
      state.cohortImported=true;
    }
    if(params.has('job'))state.teacherChallengeJob=Number(params.get('job'));
    if(params.has('student'))state.teacherStudentDetail=params.get('student');
    if(params.get('sfilter')==='open')state.studentFilterOpen=true;
    if(params.has('sclass'))state.studentClassFilter=params.get('sclass');
    if(params.has('sunit'))state.studentUnitFilter=params.get('sunit');
    if(params.has('sstatus'))state.studentFilter=params.get('sstatus');
    if(params.has('sq'))state.studentQuery=params.get('sq');
    if(params.has('reportfilter'))state.reportFilter=params.get('reportfilter');
    if(params.has('feedback'))state.reportFeedback=params.get('feedback');
    if(params.get('reportfiles')==='1'){
      state.reportDraftHtml='<p>本周完成「汉阳知音」公众号推文排版 3 篇，参与江滩文旅短视频拍摄，并独立完成 1 条 45 秒竖屏视频粗剪。</p><p>下周计划继续跟进文旅选题，提升同期声收音质量。</p>';
      state.reportImages=[{name:'江滩采访现场.jpg',size:860000}];
      state.reportAttachments=[{name:'第6周工作清单.pdf',size:420000}];
    }
    if(params.get('chat')==='record')state.chatMode='record';
    if(params.get('chat')==='qa')state.chatMode='qa';
    if(params.get('internship')==='started'){state.internshipStarted=true;state.internshipStartDate='2026-10-01';state.internshipExpectedEnd='2027-02-18';state.internshipStartEdits=0}
    if(params.get('internship')==='notstarted'){state.internshipStarted=false}
    if(params.get('files')==='1'){
      state.resumeFile={name:'李明-简历.pdf',size:286000};
      state.portfolioFiles=[{name:'融媒体实习作品集.pdf',size:1850000},{name:'短视频截图.zip',size:420000}];
    }
    document.documentElement.dataset.theme=state.theme;
    const path=(location.hash.replace(/^#\/?/, '')||'login');
    if(path!=='login'){state.role=path.split('/')[0]}
    let fn=ROUTES[path];
    const reportDetail=path.match(/^teacher\/reports\/(\d+)$/);
    if(reportDetail)fn=()=>renderTeacherReportDetail(Number(reportDetail[1]));
    if(!fn)fn=renderLogin;
    document.getElementById('app').innerHTML=fn();
    document.querySelector('main')?.scrollTo(0,0);
    window.scrollTo(0,0);
  }
  window.addEventListener('hashchange',render);
  render();
</script>
