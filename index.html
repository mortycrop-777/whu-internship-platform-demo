  /* ---------- 周报 ---------- */
  function ixTimeToMinutes(value){
    if(!value)return null;
    const parts=String(value).split(':').map(Number);
    if(parts.length<2||Number.isNaN(parts[0])||Number.isNaN(parts[1]))return null;
    return parts[0]*60+parts[1];
  }
  function ixMinutesLabel(minutes){
    if(minutes===null||Number.isNaN(minutes))return '';
    const total=Math.round(minutes);
    const hour=Math.floor(total/60)%24;
    const minute=total%60;
    return `${String(hour).padStart(2,'0')}:${String(minute).padStart(2,'0')}`;
  }
  function ixWeekFacts(week){
    const start=ixWeekStart(week),end=ixWeekEnd(week);
    const entries=Object.entries(state.internshipDayLogs||{}).filter(([date])=>date>=start&&date<=end);
    let hours=0,startSum=0,startCount=0,endSum=0,endCount=0;
    const moods={};
    entries.forEach(([,log])=>{
      const value=ixHours(log);
      if(value!==null)hours+=value;
      const start=ixTimeToMinutes(log.start);
      if(start!==null){startSum+=start;startCount+=1}
      const end=ixTimeToMinutes(log.end);
      if(end!==null){endSum+=end;endCount+=1}
      if(log.mood)moods[log.mood]=(moods[log.mood]||0)+1;
    });
    return {
      days:entries.length,
      hours:Math.round(hours*10)/10,
      avgStart:startCount?ixMinutesLabel(startSum/startCount):'',
      avgEnd:endCount?ixMinutesLabel(endSum/endCount):'',
      moods:Object.entries(moods).sort((a,b)=>b[1]-a[1]).slice(0,6)
    };
  }
  function ixWeekRangeLabel(week){
    const start=formatDate(ixWeekStart(week));
    const end=formatDate(ixWeekEnd(week));
    return start.slice(0,7)===end.slice(0,7)?`${start} – ${end.slice(5)}`:`${start} – ${end}`;
  }
  function ixWeekNodeClass(week,current,selected){
    const report=ixWeekReport(week);
    const status=report?(report.status==='已评价'?'is-evaluated':'is-pending'):(week<current?'is-missing':week>current?'is-future':'');
    return ['ix-wd',status,week===selected?'is-on':'',week===current?'is-current':''].filter(Boolean).join(' ');
  }
  function ixWeekNodes(selected,current){
    let html='';
    for(let week=1;week<=IX_WEEKS;week+=1){
      html+=`<button type="button" class="${ixWeekNodeClass(week,current,selected)}" data-week="${week}" role="tab" aria-selected="${week===selected}" aria-label="第 ${week} 周" onclick="ixSelectWeek(${week})">${week}</button>`;
    }
    return html;
  }
  const IX_LOCK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="5.5" y="10.5" width="13" height="9.5" rx="2.2"/><path d="M8.5 10.5V8a3.5 3.5 0 0 1 7 0v2.5"/></svg>';
  function ixWeekSlogan(facts){
    if(!facts.days)return '这一周还没有打卡记录';
    const mood=facts.moods[0];
    const moodName=mood?IX_MOOD_NAMES[IX_MOODS.indexOf(mood[0])]||'':null;
    let line;
    if(facts.hours>=42)line='这周有点拼';
    else if(facts.hours>=30)line='这周节奏刚好';
    else line='这周轻一点，也算在积累';
    return moodName?`${line}；最常带走「${moodName}」`:line;
  }
  function ixWeekShareText(week){
    const facts=ixWeekFacts(week);
    const label=`第 ${week} 周`;
    if(!facts.days)return `${label}实习小结：这一周还没有打卡记录。`;
    return `${label}实习小结：${facts.days} 天 · ${Math.round(facts.hours)} 小时，平均 ${facts.avgStart||'—'}–${facts.avgEnd||'—'}。${ixWeekSlogan(facts)}`;
  }
  function ixRoundRect(ctx,x,y,w,h,r){
    ctx.beginPath();
    ctx.moveTo(x+r,y);
    ctx.arcTo(x+w,y,x+w,y+h,r);
    ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r);
    ctx.arcTo(x,y,x+w,y,r);
    ctx.closePath();
  }
  function ixWrapText(ctx,text,x,y,maxWidth,lineHeight){
    const chars=String(text).split('');
    let line='',cursor=y;
    chars.forEach(char=>{
      const test=line+char;
      if(ctx.measureText(test).width>maxWidth&&line){
        ctx.fillText(line,x,cursor);
        line=char;
        cursor+=lineHeight;
      }else{
        line=test;
      }
    });
    if(line)ctx.fillText(line,x,cursor);
    return cursor+lineHeight;
  }
  function ixSaveWeekCard(week){
    const facts=ixWeekFacts(week);
    const label=`第 ${week} 周`;
    const slogan=ixWeekSlogan(facts);
    const canvas=document.createElement('canvas');
    const W=680,H=520,ratio=2;
    canvas.width=W*ratio;canvas.height=H*ratio;
    const ctx=canvas.getContext('2d');
    ctx.scale(ratio,ratio);
    const page=ctx.createLinearGradient(0,0,W,H);
    page.addColorStop(0,'#F7FAFF');page.addColorStop(1,'#E9F1FB');
    ctx.fillStyle=page;ctx.fillRect(0,0,W,H);
    const cx=36,cy=36,cw=608,ch=448,r=26;
    const left=cx+36;
    ixRoundRect(ctx,cx,cy,cw,ch,r);
    const card=ctx.createLinearGradient(cx,cy,cx+cw,cy+ch);
    card.addColorStop(0,'#0F1A2C');card.addColorStop(.55,'#17263F');card.addColorStop(1,'#1E3A63');
    ctx.fillStyle=card;ctx.fill();
    ctx.save();
    ixRoundRect(ctx,cx,cy,cw,ch,r);ctx.clip();
    const glow=ctx.createRadialGradient(cx+cw-60,cy-30,10,cx+cw-60,cy-30,430);
    glow.addColorStop(0,'rgba(92,134,224,.45)');glow.addColorStop(1,'rgba(92,134,224,0)');
    ctx.fillStyle=glow;ctx.fillRect(cx,cy,cw,ch);
    ctx.fillStyle='rgba(255,255,255,.05)';
    ctx.font='700 150px "Songti SC","Noto Serif SC",serif';
    ctx.textAlign='right';
    ctx.fillText(String(week),cx+cw-18,cy+ch+16);
    ctx.textAlign='left';
    ctx.restore();
    ixRoundRect(ctx,cx+.5,cy+.5,cw-1,ch-1,r);
    ctx.strokeStyle='rgba(255,255,255,.09)';ctx.lineWidth=1;ctx.stroke();
    ctx.fillStyle='#EFD9A6';
    ctx.font='600 26px "Songti SC","Noto Serif SC",serif';
    ctx.fillText(label,left,cy+76);
    ctx.fillStyle='#8FA2BC';
    ctx.font='400 13px -apple-system,"PingFang SC",sans-serif';
    ctx.fillText(ixWeekRangeLabel(week),left,cy+102);
    ctx.fillStyle='#F4EDDD';
    ctx.strokeStyle='rgba(233,242,255,.45)';ctx.lineWidth=1.3;
    const lockX=cx+cw-58,lockY=cy+48;
    ctx.beginPath();ctx.rect(lockX,lockY+7,14,11);ctx.stroke();
    ctx.beginPath();ctx.arc(lockX+7,lockY+7,4.6,Math.PI,0);ctx.stroke();
    ctx.fillStyle='#F4EDDD';
    ctx.font='400 27px "Songti SC","Noto Serif SC",serif';
    let cursor=ixWrapText(ctx,slogan,left,cy+150,cw-92,40);
    cursor+=4;
    const rule=ctx.createLinearGradient(left,0,left+300,0);
    rule.addColorStop(0,'rgba(232,200,122,.8)');rule.addColorStop(1,'rgba(232,200,122,0)');
    ctx.strokeStyle=rule;ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(left,cursor);ctx.lineTo(left+300,cursor);ctx.stroke();
    cursor+=58;
    ctx.fillStyle='#FFFFFF';
    ctx.font='700 54px "DIN Alternate","SF Pro Display",-apple-system,sans-serif';
    const hoursText=facts.days?String(facts.hours):'—';
    ctx.fillText(hoursText,left,cursor);
    const hoursWidth=ctx.measureText(hoursText).width;
    ctx.fillStyle='rgba(214,228,246,.62)';
    ctx.font='500 14px -apple-system,"PingFang SC",sans-serif';
    ctx.fillText('小时',left+hoursWidth+10,cursor-4);
    cursor+=28;
    const daysText=facts.days?`${facts.days} 天`:'';
    ctx.font='400 14px -apple-system,"PingFang SC",sans-serif';
    ctx.fillStyle='#C6D3E6';
    ctx.fillText(daysText,left,cursor);
    const daysWidth=ctx.measureText(daysText).width;
    ctx.fillStyle='#5E6F86';
    ctx.fillText('·',left+daysWidth+8,cursor);
    ctx.fillStyle='#8FA2BC';
    ctx.font='400 14px -apple-system,"PingFang SC",sans-serif';
    ctx.fillText(facts.avgStart&&facts.avgEnd?`平均 ${facts.avgStart} – ${facts.avgEnd}`:'—',left+daysWidth+22,cursor);
    cursor+=34;
    const emojiFont='400 20px "Apple Color Emoji","Segoe UI Emoji",sans-serif';
    const countFont='400 12px -apple-system,"PingFang SC",sans-serif';
    let chipX=left;
    facts.moods.forEach(([mood,count])=>{
      ctx.font=emojiFont;
      const emojiWidth=ctx.measureText(mood).width;
      ctx.font=countFont;
      const countWidth=ctx.measureText(String(count)).width;
      const chipWidth=22+emojiWidth+6+countWidth;
      if(chipX+chipWidth>left+340){chipX=left;cursor+=34}
      ixRoundRect(ctx,chipX,cursor-15,chipWidth,26,8);
      ctx.fillStyle='rgba(255,255,255,.06)';ctx.fill();
      ctx.strokeStyle='rgba(255,255,255,.08)';ctx.lineWidth=1;ctx.stroke();
      ctx.font=emojiFont;ctx.fillStyle='#DCE6F5';
      ctx.fillText(mood,chipX+10,cursor+3);
      ctx.font=countFont;ctx.fillStyle='#8CA0BC';
      ctx.fillText(String(count),chipX+10+emojiWidth+6,cursor+3);
      chipX+=chipWidth+8;
    });
    ctx.fillStyle='rgba(255,255,255,.3)';
    ctx.font='400 12px -apple-system,"PingFang SC",sans-serif';
    ctx.fillText('实习记录 · 仅自己可见',left,cy+ch-32);
    const link=document.createElement('a');
    link.download=`实习小结-第${week}周.png`;
    link.href=canvas.toDataURL('image/png');
    document.body.appendChild(link);
    link.click();
    link.remove();
    toast('卡片已保存');
  }
  function ixShareWeekCard(week){
    const text=ixWeekShareText(week);

      }else{

      status=`<div class="ix-rep-status is-pending"><b class="is-plain">未评分</b></div>`;

  function ixSubmitReport(event,week){
    event.preventDefault();

    const input=form.querySelector('input[type="file"]');
    const file=input&&input.files&&input.files[0];
    if(!file){toast('请选择周报文件');return}

    if(file.size>20*1024*1024){toast('文件不能超过 20MB');return}
    const note=(new FormData(form).get('note')||'').trim();
    const label=`第 ${week} 周`;
    state.studentHistory=state.studentHistory.filter(item=>ixWeekNum(item.week)!==week);
    state.studentHistory.unshift({week:label,status:'待评价',file:{name:file.name,size:file.size},note,submittedAt:IX_TODAY});
    state.reports.unshift({student:state.studentProfile.name,week:label,unit:state.studentProfile.unit,status:'待评价',content:`周报文件：${file.name}${note?`；备注：${note}`:''}`,reflect:'',plan:''});

    ixRefreshReports(week);
    toast(`第 ${week} 周周报已提交`);

  let ixTiltActive=null;
  function ixTiltReset(){
    if(!ixTiltActive)return;
    const card=ixTiltActive;
    ixTiltActive=null;
    card.style.transform='';
    card.style.removeProperty('--gx');
    card.style.removeProperty('--gy');
    card.classList.remove('is-tilting');
  }
  function ixTiltMove(event){
    if(event.pointerType==='touch')return;
    if(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;
    const card=event.target&&event.target.closest?event.target.closest('[data-tilt]'):null;
    if(!card){ixTiltReset();return}
    if(ixTiltActive&&ixTiltActive!==card)ixTiltReset();
    ixTiltActive=card;
    const rect=card.getBoundingClientRect();
    if(!rect.width||!rect.height)return;
    const px=Math.min(1,Math.max(0,(event.clientX-rect.left)/rect.width));
    const py=Math.min(1,Math.max(0,(event.clientY-rect.top)/rect.height));
    const max=Number(card.dataset.tilt)||6;
    const rx=(0.5-py)*max;
    const ry=(px-0.5)*max;
    card.style.setProperty('--gx',(px*100).toFixed(1)+'%');
    card.style.setProperty('--gy',(py*100).toFixed(1)+'%');
    card.style.transform=`perspective(820px) rotateX(${rx.toFixed(2)}deg) rotateY(${ry.toFixed(2)}deg) translateY(3px) scale(.992)`;
    card.classList.add('is-tilting');
  }

  function parseCsvLine(line){
    const cells=[];let value='';let quoted=false;
    for(let i=0;i<line.length;i++){
      const ch=line[i];
      if(ch==='"'){
        if(quoted&&line[i+1]==='"'){value+='"';i++}else quoted=!quoted;
      }else if(ch===','&&!quoted){cells.push(value.trim());value=''}else value+=ch;
    }
    cells.push(value.trim());
    return cells;
  }
  function maskIdNumber(id){return id.length>8?`${id.slice(0,4)}${'*'.repeat(id.length-8)}${id.slice(-4)}`:'****'}
  function parseStudentImportCsv(text){
    const lines=String(text).replace(/^\uFEFF/,'').split(/\r?\n/).filter(line=>line.trim());
    if(lines.length<2)return {rows:[],error:'文件为空，或只有表头没有学生数据'};
    const headers=parseCsvLine(lines[0]).map(h=>h.replace(/\s+/g,'').toLowerCase());
    const noIndex=headers.findIndex(h=>['学号','student_id','studentno'].includes(h));
    const nameIndex=headers.findIndex(h=>['姓名','name'].includes(h));
    const idIndex=headers.findIndex(h=>['身份证号','id_number','idnumber'].includes(h));
    if([noIndex,nameIndex,idIndex].some(i=>i<0))return {rows:[],error:'表头缺少必填列：学号、姓名、身份证号'};
    const seenNos=new Set();
    const seenIds=new Set();
    const rows=lines.slice(1).map((line,i)=>{
      const cells=parseCsvLine(line);
      const studentNo=(cells[noIndex]||'').trim();
      const name=(cells[nameIndex]||'').trim();
      const idNumber=(cells[idIndex]||'').trim().toUpperCase();
      const errors=[];
      if(!/^[A-Za-z0-9-]{4,30}$/.test(studentNo))errors.push('学号格式不正确');
      if(name.length<2||name.length>20)errors.push('姓名长度应为 2–20 字');
      if(!/^\d{17}[\dX]$/.test(idNumber))errors.push('身份证号应为 18 位');
      if(seenNos.has(studentNo))errors.push('学号重复');else if(studentNo)seenNos.add(studentNo);
      if(seenIds.has(idNumber))errors.push('身份证号重复');else if(idNumber)seenIds.add(idNumber);
      return {line:i+2,studentNo,name,idMasked:maskIdNumber(idNumber),valid:errors.length===0,message:errors.join('；')||'可自动创建账号'};
    });
    return {rows,error:''};
  }

  function volunteerModeLabelForStudent(name){
    if(name===state.volunteerStudentName&&state.volunteerSubmission)return state.volunteerSubmission.modeLabel||'学院安排';
    const row=DATA.students.find(student=>student[0]===name);
    return row?.[6]||'未填系统';
  }
  function studentRoster(){
    if(!state.cohortImported)return DATA.students;
    return state.cohortStudents.map(s=>[s.name,'待补充','待填报','未落实','—',s.studentNo,volunteerModeLabelForStudent(s.name)]);
  }
  const STUDENT_START_DATES={'王雨':'2026-09-15','张琪':'2026-10-20','刘洋':'2026-08-01','赵磊':'2026-07-10','周宁':'2026-10-01'};
  function studentLedgerRecord(row){
    const name=row[0];
    const mode=volunteerModeLabelForStudent(name)||row[6]||'未填系统';
    let firstUnit='';
    let secondUnit='';
    const currentSubmission=name===state.volunteerStudentName?state.volunteerSubmission:null;
    const currentEntry=currentSubmission&&state.volunteerMode==='college'?currentSubmission:null;
    if(mode==='学院安排'){
      if(currentEntry?.entries?.length){
        firstUnit=currentEntry.entries.find(entry=>entry.rank==='first')?.unit||'';
        secondUnit=currentEntry.entries.find(entry=>entry.rank==='second')?.unit||'';
      }else{
        firstUnit=row[2]||'';
        secondUnit=row[7]||'';
      }
    }
    let status=mode==='未填系统'?'未落实':row[3]||'';
    if(mode==='自己投递'){
      status=currentSubmission?.selfUnit?'已落实':(currentSubmission?'未落实':(status==='已落实'?'已落实':'未落实'));
    }
    const placementUnit=mode==='学院安排'?row[2]||'':mode==='自己投递'?(currentSubmission?.selfUnit||row[2]||''):'';
    let start='';
    if(mode!=='未填系统')start=name==='李明'?(state.internshipStarted?formatDate(state.internshipStartDate):'未开始'):(STUDENT_START_DATES[name]?formatDate(STUDENT_START_DATES[name]):'');
    return {row,name,className:row[1],mode,firstUnit,secondUnit,placementUnit,status,start};
  }
  function filteredStudentRows(){
    const q=state.studentQuery.trim().toLocaleLowerCase('zh-CN');
    return studentRoster().filter(r=>{
      const record=studentLedgerRecord(r);
      return (state.studentFilter==='全部'||record.status===state.studentFilter)
        &&(state.studentClassFilter==='全部'||r[1]===state.studentClassFilter)
        &&(state.studentDeliveryFilter==='全部'||record.mode===state.studentDeliveryFilter)
        &&(!q||[r[0],r[5]||''].join(' ').toLocaleLowerCase('zh-CN').includes(q));
    });
  }
  function activeStudentFilterCount(){
    return [state.studentFilter,state.studentClassFilter,state.studentDeliveryFilter].filter(v=>v&&v!=='全部').length;
  }

      </div>${state.teacherStudentDetail?renderStudentDetailModal():''}${state.studentImportOpen?renderStudentImportModal():''}`)

  function startSummary(i){
    if(state.summaryGenerated[i]||state.summaryStarted[i])return;

    state.summaryLoadingIndex=i;
    render();
    setTimeout(()=>{
      state.summaryGenerated[i]=true;

      if(state.summaryLoadingIndex===i)state.summaryLoadingIndex=null;
      render();

    },1200);

  function retrySummary(){
    const i=state.selectedReport;
    state.summaryGenerated[i]=false;
    state.summaryStarted[i]=false;
    state.summaryFailed[i]=false;
    state.summaryLoadingIndex=null;
    render();
    setTimeout(()=>startSummary(i),50);

  }
  function scoreReport(e){
    e.preventDefault();
    const f=new FormData(e.target);
    const level=f.get('level')||'合格';
    let score=level==='特别优秀'?95:level==='优秀'?85:70;
    const tags=[];
    if(f.get('innovation')){score+=5;tags.push('创新报告')}
    if(f.get('excerpted')){score+=3;tags.push('被摘录报告')}
    if(f.get('late')){score-=10;tags.push('延交')}
    score=Math.min(100,Math.max(0,Math.round(score)));
    const r=state.reports[state.selectedReport];
    r.status='已评价';
    r.level=level;
    r.score=score;
    r.tags=tags;
    r.comment=f.get('comment')||'';
    if(r.student===state.studentProfile.name){
      let studentReport=state.studentHistory.find(x=>x.week===r.week);
      if(!studentReport){
        studentReport={week:r.week};
        state.studentHistory.unshift(studentReport);
      }
      Object.assign(studentReport,{status:'已评价',level,score,tags:[...tags],comment:r.comment,reviewer:'朱亚兰',reviewedAt:IX_TODAY});
    }
    state.lastScoredReport=state.selectedReport;
    toast('评价已提交，本次得分 '+score);
    render();
  }

  function reviewApp(i,ok){
    const application=state.applications[i];
    if(!application)return;
    if(ok&&application[0]===state.volunteerStudentName){
      const otherLabel=application[4]==='第一志愿'?'第二志愿':application[4]==='第二志愿'?'第一志愿':'';
      const other=otherLabel?state.applications.find(item=>item[0]===application[0]&&item[4]===otherLabel):null;
      if(application[4]==='第二志愿'&&other?.[3]==='已通过'){toast('第一志愿已录用，第二志愿已结束');return}
      if(other&&other[3]==='待处理')other[3]='已结束';
    }
    application[3]=ok?'已通过':'已拒绝';
    persistVolunteerState();
    toast(ok?'已通过该志愿申请':'已拒绝该志愿申请');
    render();

      '张琪':{phone:'139 0000 5678',email:'zhangqi@whu.edu.cn',direction:'短视频运营 / 内容策划',intro:'熟悉短视频选题、脚本与平台运营，有校园账号内容策划经验。',skills:['短视频策划','数据分析','脚本写作'],resume:'张琪-短视频运营简历.pdf',resumeSize:'312 KB',resumeUrl:'assets/resumes/张琪-短视频运营简历.pdf',portfolio:'校园账号运营案例.pdf'},
      '王雨':{phone:'136 0000 2468',email:'wangyu@whu.edu.cn',direction:'内容运营 / 新闻采编',intro:'有校园媒体采写与内容运营经历，关注社会议题和深度报道。',skills:['新闻采写','内容运营','事实核查'],resume:'王雨-内容运营简历.pdf',resumeSize:'274 KB',resumeUrl:'assets/resumes/王雨-内容运营简历.pdf',portfolio:'社区采访作品集.pdf'},
      '陈静':{phone:'137 0000 1357',email:'chenjing@whu.edu.cn',direction:'新媒体编辑 / 品牌传播',intro:'擅长内容编辑与视觉排版，参与过校园公众号专题策划。',skills:['新媒体编辑','视觉排版','专题策划'],resume:'陈静-新媒体编辑简历.pdf',resumeSize:'298 KB',resumeUrl:'assets/resumes/陈静-新媒体编辑简历.pdf',portfolio:'校园专题策划作品.pdf'},
      '周宁':{phone:'135 0000 8642',email:'zhouning@whu.edu.cn',direction:'短视频运营 / 用户增长',intro:'关注短视频平台内容生态，具备账号增长和社群运营经验。',skills:['账号运营','社群维护','剪辑基础'],resume:'周宁-短视频运营简历.pdf',resumeSize:'305 KB',resumeUrl:'assets/resumes/周宁-短视频运营简历.pdf',portfolio:'账号增长复盘.pdf'}
    };
    const detail=profiles[application[0]]||{phone:'联系方式未填写',email:'邮箱未填写',direction:'待补充',intro:'学生暂未补充个人简介。',skills:[],resume:'简历待上传',resumeSize:'—',resumeUrl:'',portfolio:'暂未上传作品集'};
    const submittedResume=application[6]?{name:application[5]||detail.resume,size:application[7]||detail.resumeSize,url:application[6],fileName:application[10]||detail.resume}:detail;
    const phone=detail.phone;
    return `<div class="modal-bg"><div class="modal" style="width:680px"><div class="modal-head"><div><h3>学生志愿资料 · ${esc(application[0])}</h3><div class="job-meta" style="margin-top:4px">${esc(application[1])} · 提交于 ${esc(application[2])}</div></div><button class="modal-close" onclick="state.applicationDetail=null;render()">×</button></div>
      <div class="profile-grid" style="margin-bottom:12px"><div class="profile-row"><b>姓名</b>${esc(p.name)}</div><div class="profile-row"><b>学号</b>${esc(p.studentNo||'—')}</div><div class="profile-row"><b>班级</b>${esc(row?.[1]||p.className)}</div><div class="profile-row"><b>志愿</b>${esc(application[4]||'—')}</div><div class="profile-row"><b>当前状态</b><span class="status ${application[3]==='已通过'?'ok':application[3]==='已拒绝'?'rejected':'pending'}">${application[3]}</span></div><div class="profile-row"><b>联系电话</b>${esc(phone)}</div><div class="profile-row"><b>联系邮箱</b>${esc(detail.email)}</div><div class="profile-row"><b>实习单位</b>${esc(application[8]||p.unit)}</div></div>
      <div style="display:grid;grid-template-columns:1.25fr 1fr;gap:10px"><div class="card" style="padding:12px"><div class="card-title" style="margin-bottom:6px">求职方向</div><div class="job-meta" style="margin-bottom:8px">${esc(application[8]?`${application[1]} / ${application[8]}`:detail.direction)}</div><div class="answer-body" style="font-size:11.5px;line-height:1.75">${esc(application[12]||detail.intro)}</div><div class="job-tags" style="margin-top:10px">${detail.skills.map(skill=>`<span class="job-tag">${esc(skill)}</span>`).join('')}</div></div>
      <div class="card resume-file-card" style="padding:12px"><div class="card-head" style="margin-bottom:6px"><div class="card-title">简历与作品</div>${ICONS.doc}</div><div class="profile-row"><b>简历</b>${esc(submittedResume.name)}</div><div class="profile-row"><b>文件大小</b>${esc(submittedResume.size)}</div><div class="profile-row"><b>作品集</b>${esc(detail.portfolio)}</div>${submittedResume.url?`<div style="display:flex;gap:8px;margin-top:9px;flex-wrap:wrap"><a class="btn small" href="${esc(submittedResume.url)}" target="_blank" rel="noopener">查看简历原件</a><a class="btn small" href="${esc(submittedResume.url)}" download="${esc(submittedResume.fileName||submittedResume.name)}">下载简历 PDF</a></div>`:''}</div></div>
      ${application[3]==='待处理'?`<div class="form-actions"><button class="btn reject" onclick="reviewApp(${i},false)">× 拒绝申请</button><button class="btn approve" onclick="reviewApp(${i},true)">✓ 通过申请</button></div>`:`<div class="foot-note" style="margin-top:12px">${application[3]==='已通过'?'申请已通过，可联系学生安排后续流程。':'该申请已拒绝，如需重新评估可返回列表处理。'}</div>`}
    </div></div>`;
  }

  const ROUTES={
    'login':renderLogin,
    'settings':renderSettings,
    'student/chat':renderChat,
    'student/volunteer':renderVolunteer,
    'student/internship':renderInternship,
    'student/profile':renderStudentProfile,
    'student/challenges':renderChallenges,
    'teacher/dashboard':renderTeacherDashboard,
    'teacher/students':renderTeacherStudents,
    'teacher/reports':renderTeacherReportList,
    'enterprise/jobs':renderEnterpriseJobs,
    'enterprise/scoring':renderEnterpriseScoring,
    'enterprise/applications':renderEnterpriseApplications
  };

  function render(scrollToLatest=false){
    const oldStream=document.getElementById('chatStream');
    const oldSessionId=oldStream?.dataset.sessionId;
    const oldScrollTop=oldStream?.scrollTop||0;
    const params=new URLSearchParams(location.search);
    if(params.get('tab')==='placement')state.dashboardTab='placement';
    if(params.get('tab')==='questions')state.dashboardTab='questions';
    if(params.get('timeline')==='edit')state.timelineEdit=true;
    if(params.get('import')==='open')state.studentImportOpen=true;
    if(params.get('import')==='sample'){
      const parsed=parseStudentImportCsv(STUDENT_IMPORT_SAMPLE_CSV);
      state.studentImportOpen=true;
      state.studentImportFileName='示例学生名单.csv';
      state.studentImportRows=parsed.rows;
      state.studentImportError=parsed.error;
    }
    if(params.get('import')==='imported'){
      const parsed=parseStudentImportCsv(STUDENT_IMPORT_SAMPLE_CSV);
      state.cohortStudents=parsed.rows.filter(r=>r.valid).map(r=>({studentNo:r.studentNo,name:r.name,idMasked:r.idMasked,accountStatus:'已创建'}));
      state.cohortSize=state.cohortStudents.length;
      state.cohortImported=true;
    }
    if(params.has('student'))state.teacherStudentDetail=params.get('student');
    if(params.get('sfilter')==='open')state.studentFilterOpen=true;
    if(params.has('sclass'))state.studentClassFilter=params.get('sclass');
    if(params.has('sdelivery'))state.studentDeliveryFilter=params.get('sdelivery');
    if(params.has('sstatus'))state.studentFilter=params.get('sstatus');
    if(params.has('sq'))state.studentQuery=params.get('sq');
    if(params.has('reportfilter'))state.reportFilter=params.get('reportfilter');
    if(!ixPreviewApplied){
      ixPreviewApplied=true;
      if(params.get('theme')==='dark'){
        state.theme='dark';
        try{const clean=new URL(location.href);clean.searchParams.delete('theme');history.replaceState(null,'',clean.pathname+(clean.search||'')+clean.hash)}catch(error){}
      }
      const internshipMode=params.get('internship');
      if(internshipMode==='started'){state.internshipStarted=true;state.internshipStartDate='2026-09-07';state.internshipExpectedEnd='2026-12-26';state.ixDayDraft=null}
      else if(internshipMode==='notstarted'){state.internshipStarted=false;state.ixDayDraft=null;state.internshipDayLogs=null}
      const view=params.get('view');
      if(view==='calendar'){state.internshipTab='reports';state.internshipCalendarOpen=true}
      else if(view==='reports'||view==='works'){state.internshipTab=view;state.internshipCalendarOpen=false}
      if(params.has('day')){const day=params.get('day');if(/^\d{4}-\d{2}-\d{2}$/.test(day))state.internshipSelectedDate=day}
      if(params.has('week')){const targetWeek=Number(params.get('week'));if(targetWeek>=1&&targetWeek<=IX_WEEKS)state.internshipSelectedWeek=targetWeek}
    }
    document.documentElement.dataset.theme=state.theme;
    let path=(location.hash.replace(/^#\/?/, '')||'login');
    const allowedRoles=['student','teacher','enterprise'];
    const previewRole=allowedRoles.includes(params.get('previewRole'))?params.get('previewRole'):null;
    const userRole=normalizeRole(state.user?.role);
    let requestedRole=path.split('/')[0];
    if(!state.user&&state.demoRole)path=ChatAuth.resolveEntryPath(null,state.demoRole,path);
    else if(!state.user)path='login';
    else if(path==='login')path=previewRole?previewHome(previewRole):HOME[userRole];
    else if(path==='teacher/challenges'){
      path=HOME.teacher;
      history.replaceState(null,'','#/'+path);
    }
    else if(path!=='settings'&&!allowedRoles.includes(requestedRole))path=HOME[previewRole||userRole];
    else if(path!=='settings'&&!previewRole&&requestedRole!==userRole)path=HOME[userRole];
    requestedRole=path.split('/')[0];
    if(path!=='login'&&path!=='settings'){state.role=requestedRole}
    if(path==='settings'&&!state.role)state.role=previewRole||state.demoRole||userRole;
    let fn=ROUTES[path];
    const reportDetail=path.match(/^teacher\/reports\/(\d+)$/);
    if(reportDetail)fn=()=>renderTeacherReportDetail(Number(reportDetail[1]));
    if(!fn)fn=renderLogin;
    const ixRoute=location.hash.startsWith('#/student/internship');
    if(!ixRoute&&document.getElementById('ixReportModalWrap'))ixCloseReport();
    if(!ixRoute&&document.getElementById('ixWorkDetailWrap'))ixCloseWorkDetail();
    const ixPrevTop=ixRoute?(document.querySelector('main')?.scrollTop||0):0;
    const previousAssistantView=document.querySelector('.assistant-workspace')?.classList.contains('is-conversation') ? 'conversation' : document.querySelector('.assistant-workspace') ? 'home' : null;
    stopAssistantTyping();
    document.getElementById('app').innerHTML=fn();
    if(state.ixDayDraft)ixPlacePopover();
    const assistantWorkspace=document.querySelector('.assistant-workspace');
    if(assistantWorkspace && previousAssistantView && (assistantWorkspace.classList.contains('is-conversation')?'conversation':'home')!==previousAssistantView)assistantWorkspace.classList.add('view-enter');
    scheduleSuggestionEntranceCleanup();
    startAssistantTyping();
    document.querySelectorAll('.assistant-input,.assistant-question-input').forEach(resizeChatTextarea);
    refreshUploadUi();updateDropMask();updateComposerLayout();setSuggestionDealing(suggestionDealing);
    animateNewChatMessages();
    const newStream=document.getElementById('chatStream');
    if(newStream && currentChat()){
      if(scrollToLatest||oldSessionId!==currentChat().id)newStream.scrollTop=newStream.scrollHeight;
      else if(oldStream)newStream.scrollTop=oldScrollTop;
    }
    if(ixRoute&&!scrollToLatest)document.querySelector('main')?.scrollTo(0,ixPendingTop?0:ixPrevTop);
    else document.querySelector('main')?.scrollTo(0,0);
    ixPendingTop=false;
    window.scrollTo(0,0);
  }
  window.addEventListener('hashchange',render);
  (async()=>{
    try{state.user=await auth.me();state.role=normalizeRole(state.user?.role)}
    catch{
      const previewRole=normalizeRole(new URLSearchParams(location.search).get('previewRole'));
      if(['student','teacher','enterprise'].includes(new URLSearchParams(location.search).get('previewRole'))){
        state.previewMode=true;
        state.user={id:'preview-'+previewRole,displayName:USERS[previewRole].name,role:previewRole};
        state.role=previewRole;
      }else{state.user=null;state.role=null}
    }
    render();
    if(state.user&&state.role==='student'&&!state.previewMode)await recoverActiveTask();
  })();
</script>
